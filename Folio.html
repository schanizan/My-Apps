:root {
  --bg: #efe6d2; --bg-2: #e6dbc2; --panel: #f5eedd; --paper: #fbf7ec; --ink: #2b2218; --ink-2: #5b4b3a; --muted: #8a7b67;
  --line: #d9ccb0; --line-2: #cbbb98; --accent: #8c3b2e; --accent-ink: #fff8ec; --accent-soft: rgba(140, 59, 46, .1);
  --ok: #4e6b45; --danger: #a3321f; --sel: rgba(140, 59, 46, .22);
  --shadow: 0 1px 2px rgba(60, 40, 10, .08), 0 8px 24px rgba(60, 40, 10, .10);
  --st-idea: #b9a57e; --st-draft: #c58f3f; --st-revised: #5f80a3; --st-final: #5a8a58;
  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --display: 'Cormorant Garamond', 'Lora', Georgia, serif;
  --ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --top-h: 52px;
  --ed-fs: 19px; --ed-w: 700px; --ed-indent: 1.6em;
  color-scheme: light;
}
:root[data-theme='dark'] {
  --bg: #1a1612; --bg-2: #13100d; --panel: #231e18; --paper: #2a241d; --ink: #ebe0ca; --ink-2: #c3b69d; --muted: #8e826e;
  --line: #3a3228; --line-2: #4a4033; --accent: #dd917a; --accent-ink: #1a1612; --accent-soft: rgba(221, 145, 122, .14);
  --ok: #8fb585; --danger: #e8806b; --sel: rgba(221, 145, 122, .28);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  --st-idea: #8d7e5f; --st-draft: #c8924a; --st-revised: #7a9cc0; --st-final: #7fae7c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
#app { min-height: 100vh; }
.serif { font-family: var(--display); font-weight: 600; letter-spacing: .005em; font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }
.muted { color: var(--muted); } .small { font-size: 12px; } .pad { padding: 8px 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; }

/* buttons & fields */
.btn { display: inline-flex; align-items: center; gap: 4px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--paper); color: var(--ink); font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--bg-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--bg-2); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; border-radius: 7px; }
.btn.danger-ghost { background: transparent; color: var(--danger); border-color: var(--line-2); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--bg-2); color: var(--ink); }
.icon-btn.sm { width: 24px; height: 24px; border-radius: 6px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.field { width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; }
textarea.field { resize: vertical; line-height: 1.5; }
.field.num { max-width: 150px; } .field.sm { padding: 4px 8px; max-width: 90px; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.lbl { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.lbl .field { font-weight: 400; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--paper); font-size: 12px; margin: 0 4px 4px 0; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chips, .appears { display: flex; flex-wrap: wrap; margin-top: 4px; }
.chip.character { border-left: 3px solid var(--st-revised); } .chip.setting { border-left: 3px solid var(--st-final); } .chip.lore { border-left: 3px solid var(--st-draft); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 5px 11px; font-size: 12.5px; border-right: 1px solid var(--line-2); }
.seg button:last-child { border-right: 0; } .seg button.on { background: var(--accent); color: var(--accent-ink); }
.meter { height: 7px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.meter.slim { height: 4px; margin: 6px 0; }
.meter-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.meter.done .meter-fill, .meter-fill.done { background: var(--ok); }
.swatches { display: flex; gap: 7px; flex-wrap: wrap; padding-top: 3px; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line-2); }
.swatch.on { border-color: var(--paper); box-shadow: 0 0 0 2px var(--accent); }
.hide-sm { }
@media (max-width: 720px) { .hide-sm { display: none; } .row2 { grid-template-columns: 1fr; } }

/* menu, modal, toast */
.menu { position: fixed; z-index: 400; min-width: 180px; background: var(--paper); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; }
.menu.pop { padding: 12px; min-width: 260px; }
.menu-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; font-size: 13px; }
.menu-item:hover:not(:disabled) { background: var(--bg-2); }
.menu-item.danger { color: var(--danger); } .menu-item.armed { background: var(--danger); color: #fff; }
.menu-sep { height: 1px; background: var(--line); margin: 4px 2px; }
.panel-pop { display: flex; flex-direction: column; gap: 14px; }
.r-set { display: flex; flex-direction: column; gap: 6px; } .r-set-l { font-size: 12px; font-weight: 600; color: var(--ink-2); } .r-set-v { font-weight: 400; color: var(--muted); }
.r-set input[type=range] { width: 100%; accent-color: var(--accent); }
.backdrop { position: fixed; inset: 0; z-index: 300; background: rgba(30, 20, 8, .45); display: grid; place-items: center; padding: 16px; backdrop-filter: blur(2px); }
.modal { width: min(480px, 100%); max-height: 92vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.modal.wide { width: min(640px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 6px 20px; }
.modal-head h3 { font-family: var(--display); font-size: 24px; font-weight: 600; }
.modal-body { padding: 8px 20px 12px; overflow: auto; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; }
.confirm-msg { margin: 0; line-height: 1.55; }
#toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .25s; z-index: 600; max-width: 90vw; font-size: 13px; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.radio-list { display: flex; flex-direction: column; gap: 8px; }
.radio-card { display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--paper); cursor: pointer; }
.radio-card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.radio-card input { margin-top: 3px; accent-color: var(--accent); }
.radio-card small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.help h4 { font-family: var(--display); font-size: 19px; margin: 14px 0 4px; } .help p { margin: 4px 0; line-height: 1.6; }
.help-table { border-collapse: collapse; width: 100%; margin: 6px 0; } .help-table td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; background: var(--bg-2); padding: 1px 5px; border-radius: 4px; }

/* library */
#app.library { max-width: 1180px; margin: 0 auto; padding: 0 24px 60px; }
.lib-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 0 22px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand-mark { font-size: 44px; line-height: 1; color: var(--accent); font-style: italic; }
.brand-sub { color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 14px; }
.lib-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lib-body { padding-top: 22px; }
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--line-2); margin-bottom: 18px; }
.banner.err { background: rgba(163, 50, 31, .12); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 26px 22px; }
.book-card { display: flex; gap: 14px; align-items: flex-start; }
.cover { flex: none; width: 110px; aspect-ratio: 2 / 3; border: 0; border-radius: 3px 8px 8px 3px; background: linear-gradient(105deg, rgba(0, 0, 0, .28) 0, rgba(255, 255, 255, .1) 5%, transparent 9%), linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(0, 0, 0, .22)), var(--cover); color: #f6ecd6; padding: 14px 10px 12px 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: center; box-shadow: 0 8px 18px rgba(40, 25, 5, .3), inset 0 0 0 1px rgba(255, 240, 215, .18); transition: transform .2s; position: relative; }
.cover::after { content: ''; position: absolute; inset: 7px 6px 7px 10px; border: 1px solid rgba(255, 240, 215, .35); border-radius: 2px; pointer-events: none; }
.cover:hover { transform: translateY(-3px) rotate(-.6deg); }
.cover-title { font-size: 19px; line-height: 1.1; margin-top: 22px; word-break: break-word; }
.cover-author { font-family: var(--display); font-style: italic; font-size: 12px; opacity: .85; }
.book-meta { min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-top: 2px; flex: 1; }
.bm-title { font-size: 22px; line-height: 1.15; word-break: break-word; }
.bm-actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.lib-empty { max-width: 560px; margin: 50px auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.lib-empty h2 { font-size: 34px; } .lib-empty p { color: var(--ink-2); font-family: var(--serif); line-height: 1.7; margin: 0; }
.empty-cover { width: 130px; aspect-ratio: 2 / 3; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; white-space: pre-line; font-size: 19px; border-radius: 3px 8px 8px 3px; box-shadow: 0 10px 24px rgba(40, 25, 5, .3); transform: rotate(-3deg); }
.empty-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* workspace */
#app.workspace { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: none; padding: 0; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; height: var(--top-h); padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line-2); flex: none; }
.tabs { display: flex; gap: 2px; margin: 0 auto 0 8px; }
.tab { border: 0; background: none; padding: 8px 14px; border-radius: 8px; color: var(--ink-2); font-weight: 500; }
.tab:hover { background: var(--bg-2); } .tab.on { background: var(--accent); color: var(--accent-ink); }
.top-right { display: flex; align-items: center; gap: 8px; }
.save-ind { font-size: 12px; color: var(--muted); min-width: 52px; text-align: right; } .save-ind.err { color: var(--danger); font-weight: 600; }
.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr) 310px; position: relative; }
.shell.no-binder { grid-template-columns: 0 minmax(0, 1fr) 310px; } .shell.no-insp { grid-template-columns: 290px minmax(0, 1fr) 0; } .shell.no-binder.no-insp { grid-template-columns: 0 minmax(0, 1fr) 0; }
.shell.no-binder .binder, .shell.no-insp .inspector { display: none; }
.binder { grid-column: 1; background: var(--panel); border-right: 1px solid var(--line-2); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.main { grid-column: 2; min-width: 0; min-height: 0; overflow: auto; background: var(--bg); position: relative; }
.main[data-tab='write'] { overflow: hidden; display: flex; flex-direction: column; }
.inspector { grid-column: 3; background: var(--panel); border-left: 1px solid var(--line-2); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
.scrim { display: none; }
.binder-head { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
.book-name { border: 0; background: none; text-align: left; padding: 0; font-size: 24px; line-height: 1.1; color: var(--ink); }
.book-name:hover { color: var(--accent); } .binder-sub { font-size: 12px; color: var(--ink-2); }
.tree { flex: 1; overflow: auto; padding: 8px 6px; }
.row { display: flex; align-items: center; gap: 4px; padding: 5px 6px 5px 8px; border-radius: 7px; cursor: pointer; position: relative; border: 1px solid transparent; user-select: none; }
.row:hover { background: var(--bg-2); }
.row.selected { background: var(--accent-soft); border-color: var(--accent); }
.row.part { font-family: var(--display); font-weight: 600; font-size: 16px; margin-top: 8px; text-transform: none; letter-spacing: .01em; }
.row.chapter { font-weight: 600; }
.row.scene { font-weight: 400; color: var(--ink-2); } .row.scene.selected { color: var(--ink); }
.row-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-wc { font-family: var(--ui); font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.row-menu { opacity: 0; } .row:hover .row-menu, .row.selected .row-menu, .row-menu:focus-visible { opacity: 1; }
.caret { border: 0; background: none; width: 16px; height: 16px; display: grid; place-items: center; padding: 0; color: var(--muted); transition: transform .15s; } .caret.open { transform: rotate(90deg); }
.caret-sp { width: 16px; flex: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; margin: 0 4px; flex: none; }
.st-bg-idea { background: var(--st-idea); } .st-bg-draft { background: var(--st-draft); } .st-bg-revised { background: var(--st-revised); } .st-bg-final { background: var(--st-final); }
.rename { flex: 1; min-width: 0; padding: 2px 6px; border: 1px solid var(--accent); border-radius: 5px; background: var(--paper); font: inherit; color: var(--ink); }
.row.dragging { opacity: .4; }
.row.drop-before::before, .row.drop-after::after { content: ''; position: absolute; left: 6px; right: 6px; height: 3px; background: var(--accent); border-radius: 3px; }
.row.drop-before::before { top: -2px; } .row.drop-after::after { bottom: -2px; }
.row.drop-into { background: var(--accent-soft); outline: 2px dashed var(--accent); }
.binder-add { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); background: var(--panel); }
.binder-add .btn { flex: 1; justify-content: center; }
.insp-sec { display: flex; flex-direction: column; gap: 6px; }
.insp-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.insp-tip { line-height: 1.5; margin-top: auto; }

/* write */
.write { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 2px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.tb-btn { min-width: 32px; height: 32px; padding: 0 7px; border: 0; background: none; border-radius: 7px; color: var(--ink-2); display: inline-grid; place-items: center; }
.tb-btn:hover:not(:disabled) { background: var(--bg-2); color: var(--ink); }
.tb-text { font-weight: 700; font-size: 14px; }
.tb-sep { width: 1px; height: 20px; background: var(--line-2); margin: 0 6px; } .tb-fill { flex: 1; }
.editor-scroll { flex: 1; overflow: auto; padding: 38px 28px 0; background: var(--bg); cursor: text; }
.editor-page { max-width: var(--ed-w); margin: 0 auto; padding-bottom: 20px; cursor: text; }
.crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; letter-spacing: .02em; }
.scene-title { width: 100%; border: 0; background: none; font-size: 34px; line-height: 1.15; color: var(--ink); padding: 2px 0 14px; border-bottom: 1px solid var(--line-2); margin-bottom: 22px; }
.scene-title:focus { outline: none; border-bottom-color: var(--accent); }
.statusbar { display: flex; gap: 18px; padding: 6px 16px; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); background: var(--panel); flex: none; flex-wrap: wrap; }
.statusbar .grow { margin-left: auto; color: var(--muted); }
.statusbar .wc { font-weight: 600; color: var(--ink); }
#app.zen .topbar, #app.zen .binder, #app.zen .inspector, #app.zen .toolbar, #app.zen .statusbar { display: none; }
#app.zen .shell { grid-template-columns: 0 minmax(0, 1fr) 0; }
.zen-exit { display: none; position: fixed; top: 12px; right: 14px; z-index: 50; background: var(--paper); border: 1px solid var(--line-2); border-radius: 99px; padding: 5px 14px; font-size: 12px; opacity: .45; }
.zen-exit:hover { opacity: 1; } #app.zen .zen-exit { display: block; }
#app.zen .editor-scroll { padding-top: 12vh; }

/* CodeMirror live preview */
.cm-host { font-family: var(--serif); }
.cm-editor { background: transparent; font-size: var(--ed-fs); color: var(--ink); }
.cm-editor.cm-focused { outline: none; }
.cm-host .cm-editor .cm-scroller { font-family: var(--serif); line-height: 1.8; overflow: visible !important; }
.cm-host .cm-editor .cm-content { font-family: var(--serif); }
.cm-content { padding: 0 0 46vh; caret-color: var(--accent); }
.cm-line { padding: 0 2px 0 0; }
.cm-line.cm-para { text-indent: var(--ed-indent); padding-bottom: .5em; }
.cm-line.cm-blank { line-height: .3em; }
.cm-line.cm-h { font-family: var(--display); font-weight: 600; line-height: 1.25; padding: .55em 0 .25em; text-indent: 0; }
.cm-h1 { font-size: 2em; } .cm-h2 { font-size: 1.6em; } .cm-h3 { font-size: 1.35em; font-style: italic; } .cm-h4, .cm-h5, .cm-h6 { font-size: 1.15em; }
.cm-line.cm-quote { border-left: 3px solid var(--accent); padding-left: 1.1em; margin-left: .3em; font-style: italic; color: var(--ink-2); padding-bottom: .4em; }
.cm-line.cm-li { padding-left: 1.4em; text-indent: -.9em; padding-bottom: .15em; margin-left: .9em; }
.cm-line.cm-scene-break { text-align: center; color: var(--muted); padding: .35em 0 .6em; }
.cm-ornament { font-size: 1.15em; color: var(--accent); }
.cm-bullet { color: var(--accent); }
.cm-strong { font-weight: 700; } .cm-em { font-style: italic; } .cm-strike { text-decoration: line-through; opacity: .75; }
.cm-code { font-family: ui-monospace, Menlo, monospace; font-size: .85em; background: var(--bg-2); padding: 0 .3em; border-radius: 4px; }
.cm-link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.cm-syntax { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: .78em; font-weight: 400; font-style: normal; }
.cm-wikilink { color: var(--accent); border-bottom: 1px dashed var(--accent); cursor: pointer; }

.cm-cursor, .cm-dropCursor { border-left: 2px solid var(--accent) !important; }
.cm-selectionBackground, .cm-focused > .cm-scroller > .cm-selectionLayer .cm-selectionBackground, .cm-content ::selection { background: var(--sel) !important; }
.cm-tooltip { background: var(--paper) !important; border: 1px solid var(--line-2) !important; border-radius: 9px; box-shadow: var(--shadow); font-family: var(--ui); overflow: hidden; }
.cm-tooltip-autocomplete ul { font-family: var(--ui) !important; max-height: 220px; }
.cm-tooltip-autocomplete ul li { padding: 5px 12px !important; }
.cm-tooltip-autocomplete ul li[aria-selected] { background: var(--accent) !important; color: var(--accent-ink) !important; }
.cm-completionDetail { margin-left: 8px; opacity: .65; font-style: normal; font-size: 11px; }

/* drawer (note) */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); z-index: 250; background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: -10px 0 40px rgba(0, 0, 0, .2); display: flex; flex-direction: column; animation: slidein .2s ease; }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); } .drawer-head h3 { font-size: 24px; }
.drawer-body { padding: 16px; overflow: auto; flex: 1; }
.note-form { display: flex; flex-direction: column; gap: 14px; } .form-actions { display: flex; justify-content: flex-end; }

/* corkboard */
.board { padding: 24px 28px 60px; max-width: 1200px; margin: 0 auto; }
.board-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; } .board-head h2 { font-size: 34px; }
.board-group { margin-bottom: 30px; }
.board-group-h { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line-2); padding-bottom: 6px; margin-bottom: 14px; } .board-group-h h3 { font-size: 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { background: var(--paper); border: 1px solid var(--line-2); border-top: 4px solid var(--st-draft); border-radius: 6px; padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 0 rgba(60, 40, 10, .06), 0 6px 14px rgba(60, 40, 10, .06); position: relative; }
.card[data-status='idea'] { border-top-color: var(--st-idea); } .card[data-status='revised'] { border-top-color: var(--st-revised); } .card[data-status='final'] { border-top-color: var(--st-final); }
.card.dragging { opacity: .4; }
.card.drop-before::before { content: ''; position: absolute; left: -10px; top: 0; bottom: 0; width: 4px; background: var(--accent); border-radius: 4px; }
.card-top { display: flex; align-items: center; gap: 4px; } .grip { color: var(--muted); cursor: grab; letter-spacing: -3px; font-size: 13px; }
.card-title { flex: 1; min-width: 0; border: 0; background: none; font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--ink); padding: 0; } .card-title:focus { outline: none; border-bottom: 1px solid var(--accent); }
.card-wc { font-size: 11px; color: var(--muted); }
.card-syn { border: 0; background: none; resize: none; min-height: 84px; font-family: var(--serif); font-size: 14px; line-height: 1.5; color: var(--ink-2); padding: 0; } .card-syn:focus { outline: none; background: var(--accent-soft); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.status-sel { border: 1px solid var(--line-2); background: var(--bg); border-radius: 99px; padding: 3px 8px; font-size: 12px; color: var(--ink); }
.add-card { border: 2px dashed var(--line-2); background: none; box-shadow: none; align-items: center; justify-content: center; min-height: 150px; color: var(--muted); border-top: 2px dashed var(--line-2); }
.add-card:hover { color: var(--accent); border-color: var(--accent); }

/* notes */
.notes-view { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }
.notes-side { border-right: 1px solid var(--line-2); padding: 14px; overflow: auto; background: var(--panel); display: flex; flex-direction: column; gap: 12px; }
.notes-group-h { display: flex; justify-content: space-between; align-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); padding: 4px 4px; }
.note-item { display: flex; flex-direction: column; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 7px 10px; border-radius: 8px; }
.note-item:hover { background: var(--bg-2); } .note-item.on { background: var(--accent-soft); border-color: var(--accent); }
.ni-name { font-weight: 600; } .ni-tag { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notes-detail { padding: 28px; overflow: auto; max-width: 760px; width: 100%; margin: 0 auto; }
.field.tall { min-height: 140px; }
.empty { text-align: center; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; } .empty h3 { font-size: 30px; } .empty p { max-width: 460px; color: var(--ink-2); font-family: var(--serif); line-height: 1.7; margin: 0; }

/* stats */
.stats { padding: 24px 28px 60px; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; } .stats h2 { font-size: 34px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.tile, .panel { background: var(--paper); border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 16px; } .panel h3 { font-size: 22px; margin-bottom: 10px; }
.tile-l { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); } .tile-v { font-size: 40px; line-height: 1.1; margin: 4px 0 2px; } .tile-s { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; } @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.bars { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 180px; margin-top: 16px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; min-width: 0; }
.bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; } .bar { width: 100%; background: var(--accent); opacity: .55; border-radius: 4px 4px 0 0; min-height: 0; } .bar.hit { background: var(--ok); opacity: .9; }
.bar-col.today .bar { opacity: 1; } .bar-n { font-size: 10px; color: var(--muted); height: 14px; line-height: 14px; } .bar-l { font-size: 11px; color: var(--muted); height: 18px; line-height: 18px; }
.goal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--ok); pointer-events: none; z-index: 1; } .goal-line span { position: absolute; right: 0; top: -15px; font-size: 10px; color: var(--ok); }
.stack { display: flex; height: 16px; border-radius: 99px; overflow: hidden; gap: 2px; } .stack-seg.empty { background: var(--bg-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); } .lg i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.ch-row { display: grid; grid-template-columns: minmax(120px, 1.2fr) 2fr 70px 90px; gap: 14px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.ch-name { text-align: left; font-weight: 600; text-decoration: none; color: var(--ink); } .ch-name:hover { color: var(--accent); text-decoration: underline; }
.ch-w { text-align: right; font-weight: 600; } .ch-bar { display: flex; flex-direction: column; gap: 3px; }
@media (max-width: 720px) { .ch-row { grid-template-columns: 1fr 70px; } .ch-bar, .ch-row .field { display: none; } }

/* reader */
.reader { --r-bg: #e8dec6; --r-page: #fbf6e9; --r-ink: #2b2218; --r-muted: #8a7b67; --r-line: #d3c4a2; --r-bar: rgba(255, 250, 235, .6); position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; background: var(--r-bg); color: var(--r-ink); font-family: var(--ui); }
.reader[data-rtheme='sepia'] { --r-bg: #cdb88d; --r-page: #f0dfb8; --r-ink: #3a2a15; --r-muted: #7a6540; --r-line: #c4ad7c; --r-bar: rgba(240, 223, 184, .6); }
.reader[data-rtheme='night'] { --r-bg: #0d0b09; --r-page: #1e1a15; --r-ink: #d8cbb2; --r-muted: #8a7e69; --r-line: #3a3226; --r-bar: rgba(30, 26, 21, .8); }
.r-bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--r-bar); border-bottom: 1px solid var(--r-line); flex: none; }
.r-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--r-line); background: transparent; color: var(--r-ink); padding: 6px 12px; border-radius: 8px; } .r-btn:hover { background: rgba(128, 100, 50, .15); }
.r-title { flex: 1; text-align: center; font-family: var(--display); font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-tools { display: flex; gap: 8px; }
.r-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; padding: 0 8px; }
.r-nav { flex: none; width: 44px; height: 88px; border: 0; background: transparent; color: var(--r-muted); border-radius: 12px; display: grid; place-items: center; } .r-nav:hover:not(:disabled) { background: rgba(128, 100, 50, .14); color: var(--r-ink); }
.r-book { position: relative; flex: none; background: var(--r-page); border-radius: 5px; box-shadow: 0 24px 60px rgba(30, 18, 4, .3), 0 0 0 1px rgba(60, 40, 10, .1); }
.reader[data-rtheme='night'] .r-book { box-shadow: 0 24px 60px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .06); }
.r-spine { position: absolute; top: 0; bottom: 0; left: 50%; width: 90px; transform: translateX(-50%); background: linear-gradient(to right, transparent, rgba(40, 25, 5, .13) 48%, rgba(40, 25, 5, .2) 50%, rgba(40, 25, 5, .13) 52%, transparent); pointer-events: none; }
.reader[data-rtheme='night'] .r-spine { background: linear-gradient(to right, transparent, rgba(0, 0, 0, .35) 50%, transparent); }
.r-book.single .r-spine { display: none; }
.r-viewport { overflow: hidden; position: relative; }
.r-flow { font-family: var(--r-font); font-size: var(--r-size); line-height: var(--r-line); text-align: var(--r-align); hyphens: auto; -webkit-hyphens: auto; column-fill: auto; will-change: transform; color: var(--r-ink); }
.r-flow p { margin: 0; text-indent: 1.5em; orphans: 2; widows: 2; }
.r-flow h1, .r-flow h2 { text-indent: 0; }
.r-flow .r-chapter { break-before: column; break-after: avoid; font-family: var(--display); font-weight: 600; font-size: 1.7em; text-align: center; margin: 1.1em 0 1.3em; line-height: 1.2; }
.r-flow .r-chapter + p, .r-flow .scene-break + p, .r-flow h3 + p, .r-flow h4 + p { text-indent: 0; }
.r-flow .scene-break { text-indent: 0; text-align: center; margin: 1em 0; color: var(--r-muted); }
.r-flow .r-part { break-before: column; break-after: column; font-family: var(--display); font-weight: 600; font-size: 2.4em; text-align: center; padding-top: 28%; line-height: 1.2; margin: 0; }
.r-flow .r-titlepage { break-after: column; text-align: center; padding-top: 22%; } .r-titlepage h1 { font-family: var(--display); font-size: 2.8em; line-height: 1.1; margin: 0 0 .3em; } .r-by { text-indent: 0 !important; text-align: center; font-style: italic; font-size: 1.15em; } .r-orn { text-indent: 0 !important; text-align: center; font-size: 1.6em; color: var(--r-muted); margin-top: 1.5em !important; }
.r-flow h3, .r-flow h4, .r-flow h5, .r-flow h6 { break-after: avoid; margin: 1.2em 0 .5em; font-family: var(--display); font-size: 1.3em; text-align: left; }
.r-flow blockquote { margin: .9em 1.6em; font-style: italic; break-inside: avoid; } .r-flow blockquote p { text-indent: 0; }
.r-flow ul, .r-flow ol { margin: .6em 0; padding-left: 1.8em; }
.r-flow .r-end { text-indent: 0; text-align: center; margin-top: 3em; color: var(--r-muted); font-style: italic; }
.r-flow .r-empty { display: none; }
.r-flow a { color: inherit; text-decoration: underline; }
.r-foot { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 20px 14px; }
.r-info { font-size: 12.5px; color: var(--r-muted); text-align: center; }
.r-seek { width: min(560px, 80vw); accent-color: #8c3b2e; }
.reader[data-rtheme='night'] .r-seek { accent-color: #dd917a; }
.r-drawer { position: absolute; top: 8px; right: 12px; z-index: 5; width: min(320px, 90vw); max-height: calc(100% - 16px); overflow: auto; background: var(--r-page); border: 1px solid var(--r-line); border-radius: 12px; padding: 14px 16px; box-shadow: 0 16px 40px rgba(0, 0, 0, .25); display: flex; flex-direction: column; gap: 12px; }
.r-drawer h4 { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 0; }
.r-drawer .seg button { background: transparent; color: var(--r-ink); border-color: var(--r-line); }
.r-drawer .seg { border-color: var(--r-line); } .r-drawer .seg button.on { background: #8c3b2e; color: #fff8ec; }
.r-drawer .r-set-l { color: var(--r-ink); } .r-drawer .r-set-v { color: var(--r-muted); }
.toc-part { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--r-muted); margin-top: 6px; }
.toc-item { display: flex; justify-content: space-between; gap: 10px; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 7px; color: var(--r-ink); } .toc-item:hover { background: rgba(128, 100, 50, .15); } .toc-item.current { background: rgba(140, 59, 46, .16); font-weight: 600; } .toc-pg { color: var(--r-muted); font-size: 12px; }

/* narrow screens: binder and inspector become overlays */
@media (max-width: 999px) {
  .shell, .shell.no-binder, .shell.no-insp, .shell.no-binder.no-insp { grid-template-columns: minmax(0, 1fr); }
  .shell .binder, .shell .inspector { display: flex !important; position: fixed; top: var(--top-h); bottom: 0; z-index: 90; width: min(88vw, 330px); transition: transform .2s; box-shadow: var(--shadow); }
  .shell .binder { left: 0; transform: translateX(-105%); } .shell .inspector { right: 0; transform: translateX(105%); }
  .shell:not(.no-binder) .binder, .shell:not(.no-insp) .inspector { transform: none; }
  .shell:not(.no-binder) .scrim, .shell:not(.no-insp) .scrim { display: block; position: fixed; inset: var(--top-h) 0 0 0; z-index: 80; background: rgba(30, 20, 8, .35); }
  .main { grid-column: 1; } .notes-view { grid-template-columns: 1fr; } .notes-side { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line-2); }
  .editor-scroll { padding: 24px 16px 0; } .scene-title { font-size: 28px; } .tabs .tab { padding: 8px 9px; }
  .topbar { gap: 6px; }
}
@media (max-width: 720px) {
  :root { --top-h: 96px; }
  .topbar { flex-wrap: wrap; align-content: center; row-gap: 4px; padding: 4px 10px; }
  .tabs { order: 3; width: 100%; margin: 0; justify-content: space-between; } .tabs .tab { flex: 1; }
  .top-right { margin-left: auto; }
}
@media (max-width: 560px) { .save-ind { display: none; } .top-right { gap: 2px; } .tabs { margin-left: 0; } .brand-mark { font-size: 36px; } .cover { width: 92px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
