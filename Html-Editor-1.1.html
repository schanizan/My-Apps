/* ---------- tokens ---------- */
:root{
  --cream:#F4F1EA;
  --panel:#FFFFFF;
  --panel-soft:#FBF9F4;
  --ink:#2B2620;
  --muted:#8A8074;
  --muted-2:#B9AF9E;
  --border:#E4DED1;
  --terracotta:#D97757;
  --terracotta-dark:#B5502F;
  --amber:#C98A3E;
  --match:#F6D77A;
  --danger:#C1543C;
  --radius:8px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size:14px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

button{font-family:inherit;}
input:focus-visible, button:focus-visible, textarea:focus-visible{
  outline:2px solid var(--terracotta);
  outline-offset:1px;
}

/* ---------- header ---------- */
.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  gap:16px;
}
.header-left{
  display:flex;
  align-items:baseline;
  gap:14px;
  min-width:0;
}
.app-title{
  font-family:'DM Serif Display', Georgia, serif;
  font-size:21px;
  font-weight:400;
  color:var(--ink);
  margin:0;
  white-space:nowrap;
}
.filename-input{
  font-family:'DM Sans', sans-serif;
  font-size:13px;
  color:var(--muted);
  background:transparent;
  border:none;
  border-bottom:1px solid transparent;
  padding:2px 2px;
  min-width:80px;
  max-width:220px;
}
.filename-input:hover{border-bottom-color:var(--border);}
.filename-input:focus-visible{border-bottom-color:var(--terracotta); outline:none;}

.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.divider{
  width:1px;
  height:20px;
  background:var(--border);
  margin:0 4px;
}
.save-indicator{
  font-size:12px;
  color:var(--muted-2);
  font-style:italic;
  margin-left:6px;
  white-space:nowrap;
}

/* ---------- buttons ---------- */
.btn{
  font-size:13px;
  font-weight:500;
  color:var(--ink);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:7px 13px;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
  white-space:nowrap;
}
.btn:hover{background:#FBEDE5; border-color:#EBC5AE;}
.btn.small{padding:5px 10px; font-size:12px;}
.btn-primary{background:var(--terracotta); border-color:var(--terracotta); color:#fff;}
.btn-primary:hover{background:var(--terracotta-dark); border-color:var(--terracotta-dark);}
.btn-danger{background:var(--danger); border-color:var(--danger); color:#fff;}
.btn-danger:hover{background:#a3432e; border-color:#a3432e;}

.icon-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
  font-size:13px;
  line-height:1;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.icon-btn:hover{background:var(--panel-soft); color:var(--ink);}
.icon-btn.active{background:#FBEDE5; color:var(--terracotta-dark); border-color:#EBC5AE;}
.icon-btn:disabled{opacity:.35; cursor:default;}
.icon-btn:disabled:hover{background:transparent; color:var(--muted);}

/* ---------- main split layout ---------- */
.main{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
}
.pane{
  display:flex;
  flex-direction:column;
  min-width:180px;
  min-height:0;
  overflow:hidden;
}
.pane-left{flex:0 0 50%;}
.pane-right{flex:1 1 auto;}

.pane-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 14px;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
  background:var(--panel-soft);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.splitter{
  flex:0 0 7px;
  background:var(--panel-soft);
  border-left:1px solid var(--border);
  border-right:1px solid var(--border);
  cursor:col-resize;
  position:relative;
  flex-shrink:0;
}
.splitter:hover, .splitter.dragging{background:#EFE1D5;}
.splitter::before{
  content:'';
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:3px;
  height:28px;
  border-left:1px dotted var(--muted-2);
  border-right:1px dotted var(--muted-2);
}

/* ---------- editor pane ---------- */
.editor-wrap{
  position:relative;
  flex:1;
  min-height:0;
}
.editor-wrap .CodeMirror{
  height:100%;
  font-family:'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace;
  font-size:13px;
  line-height:1.55;
  padding-top:4px;
}

/* ---------- preview pane ---------- */
.preview-frame{
  flex:1;
  width:100%;
  border:none;
  background:#fff;
}

/* ---------- find & replace bar ---------- */
.findbar{
  position:absolute;
  top:12px;
  right:14px;
  z-index:30;
  display:none;
  flex-direction:column;
  gap:8px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 10px;
  box-shadow:0 10px 28px rgba(43,38,32,.14);
  min-width:300px;
}
.findbar.open{display:flex;}
.findbar-row{
  display:flex;
  align-items:center;
  gap:6px;
}
.findbar-input{
  flex:1;
  min-width:0;
  font-size:13px;
  font-family:'DM Sans', sans-serif;
  padding:6px 8px;
  border:1px solid var(--border);
  border-radius:6px;
  background:var(--panel-soft);
  color:var(--ink);
}
.findbar-input:focus-visible{border-color:var(--terracotta); outline:none;}
.findbar .count{
  font-size:11.5px;
  color:var(--muted);
  white-space:nowrap;
  min-width:56px;
  text-align:center;
}

/* ---------- highlight popup ---------- */
.highlight-popup{
  position:fixed;
  display:none;
  align-items:center;
  gap:6px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:6px 8px;
  box-shadow:0 10px 28px rgba(43,38,32,.18);
  z-index:40;
}
.hl-swatch{
  width:22px;
  height:22px;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.1);
  cursor:pointer;
  padding:0;
  flex-shrink:0;
  transition:transform .1s ease;
}
.hl-swatch:hover{transform:scale(1.14);}
.hl-swatch.hl-add{
  background:var(--panel-soft);
  color:var(--muted);
  font-size:14px;
  font-weight:700;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px dashed var(--muted-2);
}
.hl-swatch.hl-erase{
  background:var(--panel-soft);
  color:var(--muted);
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:6px;
  width:24px;
}
.hl-swatch.hl-erase:hover{background:#FBEDE5; color:var(--danger); border-color:#EBC5AE; transform:none;}
.hl-sep{width:1px; height:18px; background:var(--border); margin:0 2px; flex-shrink:0;}

/* ---------- CodeMirror theme: warm ---------- */
.cm-s-warm.CodeMirror{background:var(--panel); color:var(--ink);}
.cm-s-warm .CodeMirror-gutters{background:var(--panel-soft); border-right:1px solid var(--border);}
.cm-s-warm .CodeMirror-linenumber{color:var(--muted-2);}
.cm-s-warm .CodeMirror-cursor{border-left:1.5px solid var(--terracotta);}
.cm-s-warm .CodeMirror-selected{background:#F3D9C9;}
.cm-s-warm .CodeMirror-activeline-background{background:#FAF3EA;}
.cm-s-warm .cm-tag{color:var(--terracotta-dark);}
.cm-s-warm .cm-attribute{color:var(--amber);}
.cm-s-warm .cm-string{color:#6B7F4F;}
.cm-s-warm .cm-comment{color:var(--muted-2); font-style:italic;}
.cm-s-warm .cm-bracket{color:var(--muted);}
.cm-s-warm .cm-keyword{color:var(--terracotta-dark); font-weight:600;}
.cm-s-warm .cm-number{color:#7C6A9C;}
.cm-s-warm .cm-variable, .cm-s-warm .cm-property{color:var(--ink);}
.cm-s-warm .cm-meta{color:var(--muted);}
.CodeMirror-matchingbracket{color:var(--terracotta) !important; background:#FBEAE0;}
.cm-match{background:var(--match); border-radius:2px;}

/* ---------- responsive ---------- */
@media (max-width:760px){
  .main{flex-direction:column;}
  .pane-left{flex-basis:50% !important;}
  .splitter{flex-basis:7px; width:100%; cursor:row-resize;}
  .splitter::before{width:28px; height:3px; border-left:none; border-right:none; border-top:1px dotted var(--muted-2); border-bottom:1px dotted var(--muted-2);}
  .app-title{font-size:18px;}
  .save-indicator{display:none;}
}

</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <h1 class="app-title">HTML Editor</h1>
    <input type="text" id="filenameInput" class="filename-input" value="untitled.html" spellcheck="false" aria-label="File name" />
  </div>
  <div class="toolbar">
    <button class="btn" id="newBtn">New</button>
    <button class="btn" id="openBtn">Open</button>
    <button class="btn btn-primary" id="saveBtn">Save</button>
    <span class="divider"></span>
    <button class="btn" id="findBtn" title="Find (Ctrl/Cmd+F) &middot; Find &amp; Replace (Ctrl/Cmd+H)">Find</button>
    <span class="save-indicator" id="saveIndicator">Saved just now</span>
  </div>
</header>

<div class="main">

  <div class="pane pane-left" id="paneLeft">
    <div class="pane-header">
      <span>Code</span>
      <button class="btn small" id="clearHighlightsBtn" title="Clear all highlights">Clear Highlights</button>
    </div>
    <div class="editor-wrap">
      <textarea id="editor" spellcheck="false"></textarea>

      <div class="findbar" id="findbar">
        <div class="findbar-row">
          <input type="text" id="findInput" class="findbar-input" placeholder="Find in code&hellip;" spellcheck="false" autocomplete="off" />
          <span class="count" id="findCount"></span>
          <button class="icon-btn" id="findPrev" title="Previous match (Shift+Enter)" disabled>&#8593;</button>
          <button class="icon-btn" id="findNext" title="Next match (Enter)" disabled>&#8595;</button>
          <button class="icon-btn toggle-btn" id="caseToggle" title="Match case">Aa</button>
          <button class="icon-btn" id="toggleReplace" title="Toggle replace">&#8645;</button>
          <button class="icon-btn" id="findClose" title="Close (Esc)">&times;</button>
        </div>
        <div class="findbar-row" id="replaceRow" style="display:none;">
          <input type="text" id="replaceInput" class="findbar-input" placeholder="Replace with&hellip;" spellcheck="false" autocomplete="off" />
          <button class="btn small" id="replaceOne" disabled>Replace</button>
          <button class="btn small" id="replaceAll" disabled>Replace All</button>
        </div>
      </div>
    </div>
  </div>

  <div class="splitter" id="splitter"></div>

  <div class="pane pane-right" id="paneRight">
    <div class="pane-header">
      <span>Preview</span>
      <button class="btn small" id="openTabBtn">Open in New Tab &#8599;</button>
    </div>
    <iframe class="preview-frame" id="previewFrame" title="Live preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
  </div>

</div>

<input type="file" id="fileInput" accept=".html,.htm,text/html" hidden />

<div class="highlight-popup" id="highlightPopup"></div>
<input type="color" id="hlColorInput" value="#F5D76E" hidden />

  var highlightMarks = [];
  var pendingRange = null;
  var customColors = [];
  try { customColors = JSON.parse(localStorage.getItem(CUSTOM_COLORS_KEY) || '[]'); } catch (e) { customColors = []; }

  function hexToRgba(hex, alpha){
    hex = String(hex).replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c + c; }).join('');
    var r = parseInt(hex.substring(0, 2), 16);
    var g = parseInt(hex.substring(2, 4), 16);
    var b = parseInt(hex.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function serializeHighlights(){
    var out = [];
    for (var i = 0; i < highlightMarks.length; i++) {
      var pos = highlightMarks[i].mark.find();
      if (pos) {
        out.push({
          from: { line: pos.from.line, ch: pos.from.ch },
          to: { line: pos.to.line, ch: pos.to.ch },
          color: highlightMarks[i].color
        });
      }
    }
    return out;
  }

  function addHighlightMark(from, to, color){
    var marker = cm.markText(from, to, { css: 'background-color:' + hexToRgba(color, 0.35) + ';' });
    marker.isHighlight = true;
    highlightMarks.push({ mark: marker, color: color });
    return marker;
  }

  function clearHighlightMarksList(list){
    for (var i = 0; i < list.length; i++) {
      var idx = -1;
      for (var j = 0; j < highlightMarks.length; j++) {
        if (highlightMarks[j].mark === list[i]) { idx = j; break; }
      }
      if (idx !== -1) highlightMarks.splice(idx, 1);
      list[i].clear();
    }
  }

  function clearAllHighlights(){
    for (var i = 0; i < highlightMarks.length; i++) highlightMarks[i].mark.clear();
    highlightMarks = [];
    hidePopup();
    saveNow();
  }

  function addCustomColorIfNew(hex){
    hex = hex.toLowerCase();
    if (PRESET_COLORS.map(function(c){ return c.toLowerCase(); }).indexOf(hex) !== -1) return;
    customColors = customColors.filter(function(c){ return c.toLowerCase() !== hex; });
    customColors.unshift(hex);
    customColors = customColors.slice(0, 5);
    localStorage.setItem(CUSTOM_COLORS_KEY, JSON.stringify(customColors));
  }

  var suppressPopupOnce = false;

  function applyColor(hex){
    if (!pendingRange) return;
    var overlapping = cm.findMarks(pendingRange.from, pendingRange.to).filter(function(m){ return m.isHighlight; });
    clearHighlightMarksList(overlapping);
    addHighlightMark(pendingRange.from, pendingRange.to, hex);
    addCustomColorIfNew(hex);
    var endPos = pendingRange.to;
    hidePopup();
    suppressPopupOnce = true;
    cm.setCursor(endPos);
    saveNow();
  }

  function eraseAtSelectionOrCursor(){
    var toRemove;
    if (cm.somethingSelected()) {
      toRemove = cm.findMarks(cm.getCursor('from'), cm.getCursor('to')).filter(function(m){ return m.isHighlight; });
    } else {
      toRemove = cm.findMarksAt(cm.getCursor()).filter(function(m){ return m.isHighlight; });
    }
    clearHighlightMarksList(toRemove);
    hidePopup();
    cm.focus();
    saveNow();
  }

  function renderPopup(mode){
    var html = '';
    if (mode === 'add') {
      var seen = {};
      var allColors = [];
      PRESET_COLORS.concat(customColors).forEach(function(c){
        var k = c.toLowerCase();
        if (!seen[k]) { seen[k] = true; allColors.push(c); }
      });
      allColors.forEach(function(hex){
        html += '<button type="button" class="hl-swatch" data-color="' + hex + '" style="background:' + hex + ';" title="Highlight this color"></button>';
      });
      html += '<button type="button" class="hl-swatch hl-add" id="hlAddCustom" title="Custom color">+</button>';
      html += '<span class="hl-sep"></span>';
    }
    html += '<button type="button" class="hl-swatch hl-erase" id="hlErase" title="Remove highlight">&#8709;</button>';
    highlightPopup.innerHTML = html;

    var swatchBtns = highlightPopup.querySelectorAll('.hl-swatch[data-color]');
    for (var i = 0; i < swatchBtns.length; i++) {
      swatchBtns[i].addEventListener('mousedown', function(e){ e.preventDefault(); });
      swatchBtns[i].addEventListener('click', function(e){ applyColor(e.currentTarget.getAttribute('data-color')); });
    }
    var addBtn = document.getElementById('hlAddCustom');
    if (addBtn) {
      addBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });
      addBtn.addEventListener('click', function(){ hlColorInput.click(); });
    }
    var eraseBtn = document.getElementById('hlErase');
    eraseBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    eraseBtn.addEventListener('click', eraseAtSelectionOrCursor);
  }

  function positionPopup(c1, c2){
    highlightPopup.style.visibility = 'hidden';
    highlightPopup.style.display = 'flex';
    var w = highlightPopup.offsetWidth, h = highlightPopup.offsetHeight;
    var left = (c1.left + c2.left) / 2 - w / 2;
    left = Math.max(8, Math.min(window.innerWidth - w - 8, left));
    var top = c1.top - h - 10;
    if (top < 56) top = c2.bottom + 10;
    highlightPopup.style.left = left + 'px';
    highlightPopup.style.top = top + 'px';
    highlightPopup.style.visibility = 'visible';
  }

  function hidePopup(){
    highlightPopup.style.display = 'none';
    pendingRange = null;
  }

  function updateHighlightPopup(){
    if (cm.somethingSelected()) {
      var from = cm.getCursor('from'), to = cm.getCursor('to');
      pendingRange = { from: from, to: to };
      renderPopup('add');
      positionPopup(cm.cursorCoords(from, 'window'), cm.cursorCoords(to, 'window'));
    } else {
      var pos = cm.getCursor();
      var marksHere = cm.findMarksAt(pos).filter(function(m){ return m.isHighlight; });
      if (marksHere.length) {
        pendingRange = null;
        renderPopup('remove');
        var c = cm.cursorCoords(pos, 'window');
        positionPopup(c, c);
      } else {
        hidePopup();
      }
    }
  }

  try {
    var storedHl = JSON.parse(localStorage.getItem(HIGHLIGHTS_KEY) || '[]');
    for (var hi = 0; hi < storedHl.length; hi++) {
      addHighlightMark(storedHl[hi].from, storedHl[hi].to, storedHl[hi].color);
    }
  } catch (e) { /* ignore malformed stored highlights */ }

  cm.on('cursorActivity', function(){
    if (suppressPopupOnce) { suppressPopupOnce = false; return; }
    updateHighlightPopup();
  });

  hlColorInput.addEventListener('input', function(){
    if (pendingRange) applyColor(hlColorInput.value);
  });

  clearHighlightsBtn.addEventListener('click', clearAllHighlights);

  document.addEventListener('mousedown', function(e){
    if (highlightPopup.style.display === 'none' || !highlightPopup.style.display) return;
    var withinPopup = highlightPopup.contains(e.target);
    var withinEditor = cm.getWrapperElement().contains(e.target);
    if (!withinPopup && !withinEditor) hidePopup();
  });

  // ---------- split ratio ----------
  var savedSplit = localStorage.getItem(SPLIT_KEY);
  if (savedSplit) paneLeft.style.flexBasis = savedSplit;

  var dragging = false;
  splitter.addEventListener('mousedown', function(){
    dragging = true;
    splitter.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
  });
  document.addEventListener('mousemove', function(e){
    if (!dragging) return;
    var rect = mainEl.getBoundingClientRect();
    var pct = ((e.clientX - rect.left) / rect.width) * 100;
    pct = Math.max(18, Math.min(82, pct));
    paneLeft.style.flexBasis = pct + '%';
  });
  document.addEventListener('mouseup', function(){
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    localStorage.setItem(SPLIT_KEY, paneLeft.style.flexBasis);
    cm.refresh();
  });
  window.addEventListener('resize', function(){ cm.refresh(); });

  // ---------- live preview ----------
  function updatePreviewNow(){
    previewFrame.srcdoc = cm.getValue();
  }
  updatePreviewNow();

  // ---------- autosave ----------
  var lastSaved = Date.now();
  function tickIndicator(){
    var secs = Math.round((Date.now() - lastSaved) / 1000);
    var text;
    if (secs < 2) text = 'Saved just now';
    else if (secs < 60) text = 'Saved ' + secs + 's ago';
    else text = 'Saved ' + Math.round(secs / 60) + 'm ago';
    saveIndicator.textContent = text;
  }
  setInterval(tickIndicator, 1000);
  tickIndicator();

  function saveNow(){
    localStorage.setItem(STORAGE_KEY, cm.getValue());
    localStorage.setItem(HIGHLIGHTS_KEY, JSON.stringify(serializeHighlights()));
    lastSaved = Date.now();
    tickIndicator();
  }

  var previewTimer = null;
  var saveTimer = null;
  cm.on('change', function(){
    clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreviewNow, 300);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 800);
    if (findbar.classList.contains('open') && findInput.value) {
      clearTimeout(cm._searchDebounce);
      cm._searchDebounce = setTimeout(function(){ runSearch(findInput.value); }, 150);
    }
  });

  filenameInput.addEventListener('input', function(){
    localStorage.setItem(FILENAME_KEY, filenameInput.value.trim() || 'untitled.html');
  });

  // ---------- new / open / save ----------
  var confirmingNew = false;
  var confirmTimer = null;
  function resetNewBtn(){
    confirmingNew = false;
    newBtn.textContent = 'New';
    newBtn.classList.remove('btn-danger');
  }
  newBtn.addEventListener('click', function(){
    if (confirmingNew) {
      clearTimeout(confirmTimer);
      for (var ci = 0; ci < highlightMarks.length; ci++) highlightMarks[ci].mark.clear();
      highlightMarks = [];
      hidePopup();
      cm.setValue(NEW_DOC_HTML);
      filenameInput.value = 'untitled.html';
      localStorage.setItem(FILENAME_KEY, 'untitled.html');
      saveNow();
      updatePreviewNow();
      resetNewBtn();
    } else {
      confirmingNew = true;
      newBtn.textContent = 'Confirm Clear?';
      newBtn.classList.add('btn-danger');
      confirmTimer = setTimeout(resetNewBtn, 3000);
    }
  });

  saveBtn.addEventListener('click', function(){
    var blob = new Blob([cm.getValue()], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filenameInput.value.trim() || 'untitled.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  });

  openBtn.addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      for (var oi = 0; oi < highlightMarks.length; oi++) highlightMarks[oi].mark.clear();
      highlightMarks = [];
      hidePopup();
      cm.setValue(String(reader.result));
      filenameInput.value = file.name;
      localStorage.setItem(FILENAME_KEY, file.name);
      saveNow();
      updatePreviewNow();
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  openTabBtn.addEventListener('click', function(){
    var blob = new Blob([cm.getValue()], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  });

  // ---------- find & replace ----------
  var marks = [];
  var matches = [];
  var currentMatch = -1;
  var caseSensitive = false;

  function escapeRegex(s){
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  function clearHighlights(){
    for (var i = 0; i < marks.length; i++) marks[i].clear();
    marks = [];
  }
  function updateCount(){
    if (!findInput.value) { findCount.textContent = ''; }
    else if (!matches.length) { findCount.textContent = 'No results'; }
    else { findCount.textContent = (currentMatch + 1) + ' of ' + matches.length; }
    findPrevBtn.disabled = matches.length === 0;
    findNextBtn.disabled = matches.length === 0;
    replaceOneBtn.disabled = matches.length === 0;
    replaceAllBtn.disabled = matches.length === 0;
  }
  function runSearch(query){
    clearHighlights();
    matches = [];
    currentMatch = -1;
    if (!query) { updateCount(); return; }
    var flags = caseSensitive ? 'g' : 'gi';
    var re;
    try { re = new RegExp(escapeRegex(query), flags); }
    catch (e) { updateCount(); return; }
    var cursor = cm.getSearchCursor(re, { line: 0, ch: 0 });
    while (cursor.findNext()) {
      matches.push({ from: cursor.from(), to: cursor.to() });
      marks.push(cm.markText(cursor.from(), cursor.to(), { className: 'cm-match' }));
    }
    updateCount();
    if (matches.length) goToMatch(0);
  }
  function goToMatch(idx){
    if (!matches.length) return;
    currentMatch = (idx + matches.length) % matches.length;
    var m = matches[currentMatch];
    cm.setSelection(m.from, m.to);
    cm.scrollIntoView({ from: m.from, to: m.to }, 80);
    updateCount();
  }
  function findNext(){ if (matches.length) goToMatch(currentMatch + 1); }
  function findPrev(){ if (matches.length) goToMatch(currentMatch - 1); }

  var findDebounce = null;
  findInput.addEventListener('input', function(){
    clearTimeout(findDebounce);
    findDebounce = setTimeout(function(){ runSearch(findInput.value); }, 120);
  });
  findInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') {
      e.preventDefault();
      if (e.shiftKey) findPrev(); else findNext();
    } else if (e.key === 'Escape') {
      closeFind();
    }
  });
  replaceInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); replaceOneBtn.click(); }
    else if (e.key === 'Escape') { closeFind(); }
  });

  findPrevBtn.addEventListener('click', findPrev);
  findNextBtn.addEventListener('click', findNext);
  caseToggle.addEventListener('click', function(){
    caseSensitive = !caseSensitive;
    caseToggle.classList.toggle('active', caseSensitive);
    runSearch(findInput.value);
  });
  toggleReplaceBtn.addEventListener('click', function(){
    var showing = replaceRow.style.display !== 'none';
    replaceRow.style.display = showing ? 'none' : 'flex';
    if (!showing) replaceInput.focus();
  });
  findCloseBtn.addEventListener('click', closeFind);

  replaceOneBtn.addEventListener('click', function(){
    if (!matches.length || currentMatch < 0) return;
    var m = matches[currentMatch];
    var replacement = replaceInput.value;
    cm.replaceRange(replacement, m.from, m.to);
    var idx = currentMatch;
    runSearch(findInput.value);
    if (matches.length) goToMatch(Math.min(idx, matches.length - 1));
  });
  replaceAllBtn.addEventListener('click', function(){
    if (!matches.length) return;
    var replacement = replaceInput.value;
    var count = matches.length;
    for (var i = matches.length - 1; i >= 0; i--) {
      cm.replaceRange(replacement, matches[i].from, matches[i].to);
    }
    clearHighlights();
    matches = [];
    currentMatch = -1;
    findCount.textContent = 'Replaced ' + count;
    findPrevBtn.disabled = true;
    findNextBtn.disabled = true;
    replaceOneBtn.disabled = true;
    replaceAllBtn.disabled = true;
  });

  function openFind(withReplace){
    hidePopup();
    findbar.classList.add('open');
    replaceRow.style.display = withReplace ? 'flex' : 'none';
    findInput.focus();
    findInput.select();
    if (findInput.value) runSearch(findInput.value);
  }
  function closeFind(){
    findbar.classList.remove('open');
    clearHighlights();
    matches = [];
    currentMatch = -1;
    cm.focus();
  }

  findBtn.addEventListener('click', function(){ openFind(false); });

  document.addEventListener('keydown', function(e){
    var mod = e.ctrlKey || e.metaKey;
    var key = e.key.toLowerCase();
    if (mod && key === 'f') { e.preventDefault(); openFind(false); }
    else if (mod && key === 'h') { e.preventDefault(); openFind(true); }
    else if (e.key === 'Escape' && findbar.classList.contains('open')) { closeFind(); }
  });

  // initial layout pass
  requestAnimationFrame(function(){ cm.refresh(); });
})();

</script>

</body>
</html>
