<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Progress Overview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF8F4;--surface:#FFFFFF;--surface2:#F5F1EB;--border:#E8E0D4;
  --text:#1C1917;--text-muted:#78716C;--text-light:#A8A29E;
  --accent:#C2692A;--accent-light:#F5E6D8;--accent-dark:#9A4F1C;
  --green:#16A34A;--green-bg:#DCFCE7;
  --amber:#D97706;--amber-bg:#FEF9C3;
  --red:#DC2626;--red-bg:#FEE2E2;
  --blue:#2563EB;--blue-bg:#DBEAFE;
  --gray:#6B7280;--gray-bg:#F3F4F6;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.06);
  --radius:14px;--radius-sm:8px;--radius-xs:5px;
  --font-serif:'DM Serif Display',Georgia,serif;
  --font-sans:'DM Sans',system-ui,sans-serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── WELCOME ── */
#welcome{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:var(--bg);
  background-image:radial-gradient(ellipse at 15% 50%,rgba(194,105,42,.07) 0%,transparent 55%),
                   radial-gradient(ellipse at 85% 15%,rgba(194,105,42,.04) 0%,transparent 50%);
}
.wc-card{
  background:var(--surface);border-radius:20px;padding:48px 36px 44px;
  text-align:center;max-width:420px;width:100%;box-shadow:var(--shadow-lg);
}
.wc-icon{width:64px;height:64px;background:var(--accent-light);border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px}
.wc-card h1{font-family:var(--font-serif);font-size:1.65rem;margin-bottom:8px}
.wc-card>p{color:var(--text-muted);font-size:.88rem;line-height:1.6;margin-bottom:28px}
.wc-resume{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 16px;margin-bottom:14px;text-align:left}
.wc-resume-label{font-size:.68rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--accent);margin-bottom:5px}
.wc-resume-info{font-size:.82rem;color:var(--text-muted);line-height:1.6}
.wc-divider{display:flex;align-items:center;gap:12px;margin:8px 0;
  color:var(--text-light);font-size:.78rem}
.wc-divider::before,.wc-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── BUTTONS ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;border:none;border-radius:var(--radius-sm);
  padding:12px 20px;font-family:var(--font-sans);font-size:.9rem;font-weight:600;
  cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;margin-bottom:10px;
}
.btn:last-child{margin-bottom:0}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--text);color:#FAF8F4}
.btn-primary:hover{background:#292524}
.btn-secondary{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-secondary:hover{background:var(--accent-light)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-dark)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#B91C1C}
.btn-sm{padding:6px 13px;font-size:.78rem;border-radius:var(--radius-xs);margin-bottom:0}
.btn-inline{width:auto;display:inline-flex}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh;flex-direction:column}
#app.visible{display:flex}
.app-header{
  background:var(--text);color:#FAF8F4;padding:11px 18px;
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.2);flex-wrap:wrap;
}
.app-header-left{flex:1;min-width:0}
.app-eyebrow{font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:1px}
.app-title{font-family:var(--font-serif);font-size:1.12rem;font-weight:400;color:#FAF8F4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-header-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.last-saved{font-size:.68rem;color:rgba(255,255,255,.4);white-space:nowrap;margin-right:4px}
.hdr-btn{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  color:#FAF8F4;border-radius:var(--radius-xs);
  padding:6px 11px;font-family:var(--font-sans);font-size:.74rem;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:background .15s;
  display:flex;align-items:center;gap:5px;
}
.hdr-btn:hover{background:rgba(255,255,255,.2)}
.hdr-btn.em{background:rgba(194,105,42,.35);border-color:rgba(194,105,42,.5)}
.hdr-btn.em:hover{background:rgba(194,105,42,.55)}

/* ── NAV TABS ── */
.nav-tabs{
  display:flex;background:var(--surface);border-bottom:2px solid var(--border);
  padding:0 16px;overflow-x:auto;scrollbar-width:none;
  position:sticky;top:54px;z-index:190;
}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{
  padding:11px 18px;font-family:var(--font-sans);font-size:.87rem;font-weight:500;
  color:var(--text-muted);border:none;background:none;cursor:pointer;
  white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:color .15s,border-color .15s;flex-shrink:0;
}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-tab:hover:not(.active){color:var(--text)}

/* ── SECTIONS ── */
.section{display:none}
.section.active{display:block}
.section-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--border);
  position:sticky;top:104px;z-index:180;gap:10px;
}
.view-toggle{
  display:flex;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-xs);overflow:hidden;flex-shrink:0;
}
.view-btn{
  padding:5px 13px;font-family:var(--font-sans);font-size:.78rem;font-weight:600;
  color:var(--text-muted);border:none;background:none;cursor:pointer;
  transition:background .15s,color .15s;
}
.view-btn.active{background:var(--accent);color:#fff}
.view-btn:not(.active):hover{background:var(--border)}

/* ── SCROLL ARROWS ── */
.scroll-arrows{display:none;align-items:center;gap:4px}
.scroll-arrows.visible{display:flex}
.scroll-arrow{
  width:30px;height:30px;border-radius:var(--radius-xs);
  border:1.5px solid var(--border);background:var(--surface);
  color:var(--text-muted);font-size:1rem;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s,border-color .15s;flex-shrink:0;
}
.scroll-arrow:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;padding:16px}
table.dt{
  width:100%;border-collapse:collapse;font-size:.84rem;
  background:var(--surface);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-sm);min-width:600px;
}
table.dt th{
  padding:9px 14px;font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--text-muted);background:var(--surface2);
  border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;
  user-select:none;text-align:left;
}
table.dt th:hover{color:var(--text)}
table.dt th.sorted{color:var(--accent)}
table.dt td{
  padding:9px 14px;border-bottom:1px solid var(--border);
  vertical-align:middle;color:var(--text-muted);line-height:1.45;
}
table.dt td.td-name{color:var(--text);font-weight:500}
table.dt tr:last-child td{border-bottom:none}
table.dt tbody tr{cursor:pointer;transition:background .1s}
table.dt tbody tr:hover{background:var(--surface2)}
/* Row drag-to-reorder */
table.dt tbody tr.row-dragging{opacity:.35;background:var(--accent-light)}
table.dt tbody tr.row-drag-over{border-top:2px solid var(--accent)}
.row-handle{
  color:var(--text-light);font-size:1rem;cursor:grab;padding:9px 6px 9px 14px;
  width:28px;user-select:none;
}
.row-handle:active{cursor:grabbing}
table.dt th.th-handle{width:28px;padding:9px 6px 9px 14px}

/* ── CHIPS / BADGES ── */
.chip{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 8px;border-radius:99px;font-size:.67rem;font-weight:600;white-space:nowrap;
}
.chip-green{background:var(--green-bg);color:var(--green)}
.chip-amber{background:var(--amber-bg);color:var(--amber)}
.chip-red{background:var(--red-bg);color:var(--red)}
.chip-blue{background:var(--blue-bg);color:var(--blue)}
.chip-gray{background:var(--gray-bg);color:var(--gray)}
.chip-accent{background:var(--accent-light);color:var(--accent)}
.chip-outline{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:4px}

/* ── BOARD ── */
.board-outer{overflow-x:auto;padding:14px 16px 40px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.board-outer::-webkit-scrollbar{height:5px}
.board-outer::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.board-scroll{display:flex;gap:14px;align-items:flex-start;min-width:min-content}
@media(max-width:700px){.board-scroll{flex-direction:column;min-width:unset}}
.board-col{
  background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);
  width:260px;min-width:260px;flex-shrink:0;overflow:hidden;
  transition:border-color .15s,box-shadow .15s,opacity .15s;
}
@media(max-width:700px){.board-col{width:100%;min-width:unset}}
.board-col.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
.board-col.dragging{opacity:.35}
.board-col-header{
  padding:10px 12px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);background:var(--surface2);
}
.board-col.draggable .board-col-header{cursor:grab}
.board-col.draggable .board-col-header:active{cursor:grabbing}
.drag-handle{color:var(--text-light);font-size:.95rem;line-height:1;flex-shrink:0}
.col-name{font-size:.82rem;font-weight:600;color:var(--text);flex:1;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-count{font-size:.7rem;color:var(--text-muted);background:var(--surface);
  border:1px solid var(--border);border-radius:20px;padding:1px 7px;flex-shrink:0}
.board-cards{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:50px}
.board-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 12px;cursor:pointer;transition:box-shadow .15s,transform .1s;
  box-shadow:var(--shadow-sm);
}
.board-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.bc-name{font-size:.83rem;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:6px}
.bc-summary{font-size:.74rem;color:var(--text-muted);line-height:1.55;margin-bottom:7px;white-space:pre-wrap;word-break:break-word}
.bc-next{font-size:.72rem;color:var(--accent-dark);line-height:1.55;margin-bottom:7px;
  padding-top:6px;border-top:1px dashed var(--border);white-space:pre-wrap;word-break:break-word}
.bc-next-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent);display:block;margin-bottom:2px}
.bc-tasks{display:flex;flex-direction:column;gap:2px;margin-bottom:7px;padding-top:6px;border-top:1px dashed var(--border)}
.bc-tasks-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);margin-bottom:4px}
.bc-task-item{font-size:.72rem;color:var(--blue);line-height:1.4;cursor:pointer;display:block;padding:1px 0}
.bc-task-item:hover{text-decoration:underline}
.bc-footer{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
table.dt td.td-preformat{white-space:pre-wrap;word-break:break-word;vertical-align:top;line-height:1.55}

/* ── INLINE NEW TASK FORM ── */
.new-task-form{
  margin-top:10px;padding:13px 14px;background:var(--surface2);
  border:1.5px dashed var(--border);border-radius:var(--radius-xs);
}
.new-task-form-title{font-size:.68rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--accent);margin-bottom:12px}
.new-task-form .field{margin-bottom:10px}
.new-task-form .field label{font-size:.67rem}
.empty-col{padding:18px 12px;text-align:center;font-size:.76rem;
  color:var(--text-light);font-style:italic}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:64px 20px;color:var(--text-light)}
.empty-icon{font-size:2.5rem;margin-bottom:14px}
.empty-state p{font-size:.87rem;line-height:1.7}

/* ── DRAWER ── */
#overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);
  z-index:400;backdrop-filter:blur(1px);
}
#overlay.open{display:block}
#drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(500px,100vw);
  background:var(--surface);z-index:500;
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s cubic-bezier(0.4,0,0.2,1);
  box-shadow:-8px 0 40px rgba(0,0,0,.14);
}
#drawer.open{transform:translateX(0)}
.drawer-header{
  padding:15px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  background:var(--surface);
}
.drawer-header h2{font-family:var(--font-serif);font-size:1.1rem;flex:1}
.drawer-close{
  width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);
  color:var(--text-muted);cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;transition:background .15s;
}
.drawer-close:hover{background:var(--border);color:var(--text)}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-footer{
  padding:12px 20px;border-top:1px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;background:var(--surface);
}

/* ── FORM FIELDS ── */
.field{margin-bottom:20px}
.field label{
  display:block;font-size:.72rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:7px;
}
.field input[type=text],.field input[type=date],.field textarea,.field select{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);
  border-radius:var(--radius-xs);font-family:var(--font-sans);font-size:.9rem;
  background:var(--surface);color:var(--text);transition:border-color .15s;outline:none;
  -webkit-appearance:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:76px;line-height:1.55}
.field select{cursor:pointer}

/* pill select (single / multi) */
.pill-select{display:flex;flex-wrap:wrap;gap:6px}
.pill-opt{
  padding:5px 12px;border-radius:99px;border:1.5px solid var(--border);
  font-family:var(--font-sans);font-size:.78rem;font-weight:600;
  color:var(--text-muted);background:transparent;cursor:pointer;transition:all .15s;
}
.pill-opt:hover{border-color:var(--accent);color:var(--accent)}
.pill-opt.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.pill-opt.sel.c-green{background:var(--green);border-color:var(--green)}
.pill-opt.sel.c-amber{background:var(--amber);border-color:var(--amber)}
.pill-opt.sel.c-red{background:var(--red);border-color:var(--red)}
.pill-opt.sel.c-blue{background:var(--blue);border-color:var(--blue)}
.pill-opt.sel.c-gray{background:var(--gray);border-color:var(--gray)}

/* chip select (multi) */
.chip-select{display:flex;flex-wrap:wrap;gap:6px}
.chip-opt{
  padding:4px 11px;border-radius:99px;border:1.5px solid var(--border);
  font-size:.75rem;font-weight:600;color:var(--text-muted);
  background:transparent;cursor:pointer;transition:all .15s;
}
.chip-opt:hover{border-color:var(--accent);color:var(--accent)}
.chip-opt.sel{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

/* linked list (checkbox) */
.linked-list{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto}
.linked-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;
  border:1px solid var(--border);border-radius:var(--radius-xs);
  background:var(--surface2);cursor:pointer;transition:background .1s;
}
.linked-item:hover{background:var(--border)}
.linked-item input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0}
.linked-item-name{flex:1;font-size:.82rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no-items{font-size:.8rem;color:var(--text-light);font-style:italic;padding:2px 0}
.field-divider{border:none;border-top:1px solid var(--border);margin:4px 0 24px}

/* ── CONFIRM DIALOG ── */
#confirm-dialog{
  display:none;position:fixed;inset:0;z-index:600;
  align-items:center;justify-content:center;background:rgba(0,0,0,.4);
}
#confirm-dialog.open{display:flex}
.confirm-card{
  background:var(--surface);border-radius:var(--radius);padding:28px 26px;
  max-width:360px;width:90%;box-shadow:var(--shadow-lg);text-align:center;
}
.confirm-card h3{font-family:var(--font-serif);font-size:1.1rem;margin-bottom:8px}
.confirm-card p{font-size:.84rem;color:var(--text-muted);margin-bottom:22px;line-height:1.6}
.confirm-actions{display:flex;gap:10px;justify-content:center}

/* ── TOAST ── */
#toast{
  display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1C1917;color:#FAF8F4;border-radius:var(--radius-xs);
  padding:10px 18px;font-size:.82rem;z-index:700;
  box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;pointer-events:none;
}
</style>
</head>
<body>

<!-- ── WELCOME ── -->
<div id="welcome">
  <div class="wc-card">
    <div class="wc-icon">📋</div>
    <h1>Progress Overview</h1>
    <p>Your offline project tracker. Data stays on your device — no Notion required.</p>
    <div id="wc-resume-wrap" style="display:none">
      <div class="wc-resume">
        <div class="wc-resume-label">Saved session found</div>
        <div class="wc-resume-info" id="wc-resume-info"></div>
      </div>
      <button class="btn btn-primary" onclick="resumeSession()">▶ Resume Session</button>
      <div class="wc-divider">or</div>
    </div>
    <button class="btn btn-secondary" onclick="document.getElementById('wc-file').click()">📂 Upload JSON Backup</button>
    <input type="file" id="wc-file" accept=".json" style="display:none">
    <div class="wc-divider">or</div>
    <button class="btn btn-ghost" onclick="startFresh()">✦ Start Fresh</button>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <header class="app-header">
    <div class="app-header-left">
      <div class="app-eyebrow">Offline Project Tracker</div>
      <div class="app-title">Progress Overview</div>
    </div>
    <div class="app-header-right">
      <span class="last-saved" id="last-saved"></span>
      <button class="hdr-btn" onclick="document.getElementById('imp-file').click()" title="Upload JSON backup">↑ Upload</button>
      <input type="file" id="imp-file" accept=".json" style="display:none">
      <button class="hdr-btn" onclick="exportJSON()" title="Export JSON backup">↓ Export</button>
      <button class="hdr-btn em" onclick="downloadHTML()" title="Download read-only HTML snapshot">⬇ HTML</button>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('overview',this)">📊 Progress Overview</button>
    <button class="nav-tab"        onclick="switchTab('weekly',this)">📅 Weekly Plan</button>
    <button class="nav-tab"        onclick="switchTab('categories',this)">🗂 Categories</button>
  </nav>

  <!-- OVERVIEW -->
  <div class="section active" id="section-overview">
    <div class="section-toolbar">
      <div class="view-toggle">
        <button class="view-btn active" onclick="setView('overview','table',this)">☰ Table</button>
        <button class="view-btn"        onclick="setView('overview','board',this)">▦ Board</button>
      </div>
      <div class="scroll-arrows" id="scroll-arrows-overview">
        <button class="scroll-arrow" onclick="scrollBoard('overview',-1)" title="Scroll left">◀</button>
        <button class="scroll-arrow" onclick="scrollBoard('overview', 1)" title="Scroll right">▶</button>
      </div>
      <button class="btn btn-accent btn-sm btn-inline" onclick="openDrawer('project',null)">+ Add Project</button>
    </div>
    <div id="overview-content"></div>
  </div>

  <!-- WEEKLY -->
  <div class="section" id="section-weekly">
    <div class="section-toolbar">
      <div class="view-toggle">
        <button class="view-btn active" onclick="setView('weekly','table',this)">☰ Table</button>
        <button class="view-btn"        onclick="setView('weekly','board',this)">▦ Board</button>
      </div>
      <div class="scroll-arrows" id="scroll-arrows-weekly">
        <button class="scroll-arrow" onclick="scrollBoard('weekly',-1)" title="Scroll left">◀</button>
        <button class="scroll-arrow" onclick="scrollBoard('weekly', 1)" title="Scroll right">▶</button>
      </div>
      <button class="btn btn-accent btn-sm btn-inline" onclick="openDrawer('task',null)">+ Add Task</button>
    </div>
    <div id="weekly-content"></div>
  </div>

  <!-- CATEGORIES -->
  <div class="section" id="section-categories">
    <div class="section-toolbar">
      <div style="font-size:.82rem;color:var(--text-muted)">Click any row to edit</div>
      <button class="btn btn-accent btn-sm btn-inline" onclick="openDrawer('category',null)">+ Add Category</button>
    </div>
    <div id="categories-content"></div>
  </div>
</div>

<!-- DRAWER -->
<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="drawer-header">
    <h2 id="drawer-title">Edit</h2>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<!-- CONFIRM -->
<div id="confirm-dialog">
  <div class="confirm-card">
    <h3 id="confirm-title">Confirm Delete</h3>
    <p id="confirm-msg">This cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn btn-ghost btn-sm btn-inline" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger btn-sm btn-inline" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════
const LS_KEY = 'kk_progress_v1';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const PROJECT_STATUSES = ['Active','KIV'];
const TASK_STATUSES = ['0. Not Started','1.1 In Progress','1.2 KIV','1.3 Blocked','2. Completed'];
const RISK_LEVELS = ['High','Medium','Low'];
const QUADRANTS = ['Q1','Q2','Q3','Q4'];
const Q_LABELS = {Q1:'Q1 — Do First',Q2:'Q2 — Schedule',Q3:'Q3 — Delegate',Q4:'Q4 — Eliminate'};

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let DB = { categories:[], projects:[], tasks:[], settings:{ categoryOrder:[], lastSaved:null } };
let UI = {
  tab:'overview', overviewView:'table', weeklyView:'table',
  drawerType:null, drawerItemId:null,
  sortCol:{ overview:null, weekly:null, categories:null },
  sortDir:{ overview:1, weekly:1, categories:1 },
};
let dragSrcId = null;

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// Preserves newlines and runs of spaces in HTML output
function preformat(s){ return esc(s).replace(/\n/g,'<br>').replace(/ {2}/g,'&nbsp;&nbsp;'); }
const $ = id => document.getElementById(id);

function showToast(msg,dur=3000){
  const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>{ t.style.display='none'; },dur);
}

function statusColor(s){
  if(!s) return 'gray';
  const v=s.toLowerCase();
  if(v==='active'||v.includes('completed')||v.includes('2.')) return 'green';
  if(v==='kiv'||v.includes('1.2')) return 'amber';
  if(v.includes('in progress')||v.includes('1.1')) return 'blue';
  if(v.includes('blocked')||v.includes('1.3')) return 'red';
  return 'gray';
}
function riskColor(r){ return r==='High'?'red':r==='Medium'?'amber':'green'; }
function quadColor(q){ return q==='Q1'?'red':q==='Q2'?'green':q==='Q3'?'amber':'gray'; }

function formatDate(d){
  if(!d) return '';
  try{ return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
  catch(e){ return d; }
}

function getCat(id){ return DB.categories.find(c=>c.id===id); }
function getProj(id){ return DB.projects.find(p=>p.id===id); }
function getTask(id){ return DB.tasks.find(t=>t.id===id); }

function orderedCats(){
  const order=DB.settings.categoryOrder;
  const inOrd=order.map(id=>DB.categories.find(c=>c.id===id)).filter(Boolean);
  const notIn=DB.categories.filter(c=>!order.includes(c.id));
  return [...inOrd,...notIn];
}

function syncCatOrder(){
  const ex=new Set(DB.settings.categoryOrder);
  DB.categories.forEach(c=>{ if(!ex.has(c.id)) DB.settings.categoryOrder.push(c.id); });
  DB.settings.categoryOrder=DB.settings.categoryOrder.filter(id=>DB.categories.some(c=>c.id===id));
}

// ═══════════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════════
let _saveTimer=null;
function scheduleSave(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    DB.settings.lastSaved=new Date().toISOString();
    try{ localStorage.setItem(LS_KEY,JSON.stringify(DB)); }
    catch(e){ showToast('⚠ Storage full — consider exporting a JSON backup'); }
    updateLastSaved();
  },400);
}

function updateLastSaved(){
  const el=$('last-saved'); if(!el||!DB.settings.lastSaved) return;
  const diff=Math.floor((Date.now()-new Date(DB.settings.lastSaved))/1000);
  el.textContent = diff<10?'Saved just now':diff<60?`Saved ${diff}s ago`
    :diff<3600?`Saved ${Math.floor(diff/60)}m ago`
    :'Saved '+new Date(DB.settings.lastSaved).toLocaleTimeString();
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
(function init(){
  const raw=localStorage.getItem(LS_KEY);
  if(raw){
    try{
      const saved=JSON.parse(raw);
      if(saved.projects||saved.tasks||saved.categories){
        DB=saved;
        DB.settings=DB.settings||{categoryOrder:[],lastSaved:null};
        const info=$('wc-resume-info');
        info.textContent=
          `${DB.projects.length} projects · ${DB.tasks.length} tasks · ${DB.categories.length} categories\n`+
          (DB.settings.lastSaved ? 'Last saved: '+new Date(DB.settings.lastSaved).toLocaleString() : '');
        $('wc-resume-wrap').style.display='block';
      }
    }catch(e){}
  }
  $('wc-file').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) handleUpload(f,true); });
  $('imp-file').addEventListener('change',e=>{ const f=e.target.files[0]; if(f){ handleUpload(f,false); e.target.value=''; } });
  setInterval(updateLastSaved,30000);
})();

function resumeSession(){ syncCatOrder(); showApp(); }
function startFresh(){
  DB={ categories:[], projects:[], tasks:[], settings:{ categoryOrder:[], lastSaved:null } };
  showApp();
}
function showApp(){
  $('welcome').style.display='none';
  $('app').classList.add('visible');
  renderAll(); updateLastSaved();
}
function handleUpload(file,fromWelcome){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      DB={ categories:data.categories||[], projects:data.projects||[], tasks:data.tasks||[],
           settings:data.settings||{categoryOrder:[],lastSaved:null} };
      syncCatOrder(); scheduleSave();
      if(fromWelcome) showApp();
      else{ renderAll(); showToast('✓ Data imported'); }
    }catch(err){ showToast('⚠ Could not parse file: '+err.message); }
  };
  r.readAsText(file);
}

// ═══════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════
function switchTab(tab,btn){
  UI.tab=tab;
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  $('section-'+tab).classList.add('active');
}
function setView(sec,view,btn){
  UI[sec+'View']=view;
  btn.closest('.view-toggle').querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // Show scroll arrows only in board view
  const arrows=$('scroll-arrows-'+sec);
  if(arrows) arrows.classList.toggle('visible', view==='board');
  if(sec==='overview') renderOverview();
  else renderWeekly();
}

function scrollBoard(sec, dir){
  // Find the board-outer scroll container inside the active section
  const content=$(sec==='overview'?'overview-content':'weekly-content');
  const board=content&&content.querySelector('.board-outer');
  if(!board) return;
  // Scroll by roughly 2 column widths (280px each)
  board.scrollBy({ left: dir * 560, behavior: 'smooth' });
}
function renderAll(){ renderOverview(); renderWeekly(); renderCategories(); }

// ═══════════════════════════════════════════════════════
//  SORT
// ═══════════════════════════════════════════════════════
function sortTable(sec,col){
  if(UI.sortCol[sec]===col) UI.sortDir[sec]*=-1;
  else{ UI.sortCol[sec]=col; UI.sortDir[sec]=1; }
  if(sec==='overview') renderOverview();
  else if(sec==='weekly') renderWeekly();
  else renderCategories();
}
function sortedArr(arr,sec){
  const col=UI.sortCol[sec]; const dir=UI.sortDir[sec];
  if(!col) return [...arr];
  return [...arr].sort((a,b)=>{
    let av=a[col]||''; let bv=b[col]||'';
    if(Array.isArray(av)) av=av.length; if(Array.isArray(bv)) bv=bv.length;
    return av<bv?-dir:av>bv?dir:0;
  });
}
function thHtml(sec,col,label){
  const sorted=UI.sortCol[sec]===col;
  const arrow=sorted?(UI.sortDir[sec]>0?' ↑':' ↓'):'';
  return `<th class="${sorted?'sorted':''}" onclick="sortTable('${sec}','${col}')">${label}${arrow}</th>`;
}

// ═══════════════════════════════════════════════════════
//  OVERVIEW — TABLE
// ═══════════════════════════════════════════════════════
function renderOverview(){
  $('overview-content').innerHTML='';
  if(UI.overviewView==='table') renderOverviewTable();
  else renderOverviewBoard();
}
function renderOverviewTable(){
  const el=$('overview-content');
  if(!DB.projects.length){
    el.innerHTML=emptyState('📋','No projects yet.','project'); return;
  }
  const sorted=!!UI.sortCol.overview;
  const arr=sortedArr(DB.projects,'overview');
  const rows=arr.map(p=>{
    const cats=(p.categoryIds||[]).map(id=>{ const c=getCat(id); return c?`<span class="chip chip-accent">${esc(c.name)}</span>`:''; }).join('');
    const taskLinks=(p.taskIds||[]).map(tid=>{
      const t=getTask(tid); if(!t) return '';
      return `<span class="bc-task-item" onclick="event.stopPropagation();openDrawer('task','${tid}')">▸ ${esc(t.action)}</span>`;
    }).join('');
    const drag=!sorted?`draggable="true" ondragstart="onRowDragStart(event,'${p.id}','projects')" ondragend="onRowDragEnd(event)" ondragover="onRowDragOver(event)" ondrop="onRowDrop(event,'${p.id}','projects')"` :'';
    return `<tr ${drag} onclick="openDrawer('project','${p.id}')">
      ${!sorted?`<td class="row-handle" onclick="event.stopPropagation()" title="Drag to reorder">⠿</td>`:'<td></td>'}
      <td class="td-name">${esc(p.name)}</td>
      <td>${p.status?`<span class="chip chip-${statusColor(p.status)}">${esc(p.status)}</span>`:'—'}</td>
      <td><div class="chips-wrap">${cats||'<span style="color:var(--text-light)">—</span>'}</div></td>
      <td class="td-preformat" style="max-width:240px">${preformat(p.statusSummary||'')}</td>
      <td class="td-preformat" style="max-width:200px">${preformat(p.nextAction||'')}</td>
      <td style="min-width:120px">${taskLinks||'<span style="color:var(--text-light)">—</span>'}</td>
    </tr>`;
  }).join('');
  el.innerHTML=`<div class="table-wrap"><table class="dt"><thead><tr>
    <th class="th-handle" title="${sorted?'Clear sort to enable drag':'Drag rows to reorder'}">${sorted?'':'⠿'}</th>
    ${thHtml('overview','name','Project')}${thHtml('overview','status','Status')}
    ${thHtml('overview','categoryIds','Categories')}${thHtml('overview','statusSummary','Status Summary')}
    ${thHtml('overview','nextAction','Next Action')}<th>Linked Tasks</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ═══════════════════════════════════════════════════════
//  OVERVIEW — BOARD
// ═══════════════════════════════════════════════════════
function renderOverviewBoard(){
  const el=$('overview-content');
  const cats=orderedCats();
  const uncatProjs=DB.projects.filter(p=>!(p.categoryIds||[]).length);

  let html=`<div class="board-outer"><div class="board-scroll" id="ov-board">`;
  cats.forEach(cat=>{
    const projs=DB.projects.filter(p=>(p.categoryIds||[]).includes(cat.id));
    html+=buildOvCol(cat,projs);
  });
  if(uncatProjs.length){
    html+=buildOvCol({id:'__uncat__',name:'Uncategorized'},uncatProjs,true);
  }
  html+=`</div></div>`;
  el.innerHTML=html;
}
function buildOvCol(cat,projs,uncat=false){
  const cards=projs.length
    ?projs.map(p=>{
        const taskLinks=(p.taskIds||[]).map(tid=>{
          const t=getTask(tid); if(!t) return '';
          return `<span class="bc-task-item" onclick="event.stopPropagation();openDrawer('task','${tid}')">▸ ${esc(t.action)}</span>`;
        }).join('');
        return `<div class="board-card" onclick="openDrawer('project','${p.id}')">
          <div class="bc-name">${esc(p.name)}</div>
          ${p.statusSummary?`<div class="bc-summary">${preformat(p.statusSummary)}</div>`:''}
          ${p.nextAction?`<div class="bc-next"><span class="bc-next-label">Next Action</span>${preformat(p.nextAction)}</div>`:''}
          ${taskLinks?`<div class="bc-tasks"><span class="bc-tasks-label">Tasks</span>${taskLinks}</div>`:''}
          <div class="bc-footer">
            ${p.status?`<span class="chip chip-${statusColor(p.status)}">${esc(p.status)}</span>`:''}
          </div>
        </div>`;
      }).join('')
    :'<div class="empty-col">No projects</div>';
  const drag=!uncat?`draggable="true" ondragstart="onColDragStart(event,'${cat.id}')" ondragend="onColDragEnd(event)"`:'' ;
  return `<div class="board-col${!uncat?' draggable':''}" data-cat-id="${esc(cat.id)}" ${drag}
    ondragover="onColDragOver(event)" ondrop="onColDrop(event,'${esc(cat.id)}')">
    <div class="board-col-header">
      ${!uncat?'<span class="drag-handle" title="Drag to reorder">⠿</span>':''}
      <span class="col-name">${esc(cat.name)}</span>
      <span class="col-count">${projs.length}</span>
    </div>
    <div class="board-cards">${cards}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  WEEKLY — TABLE
// ═══════════════════════════════════════════════════════
function renderWeekly(){
  $('weekly-content').innerHTML='';
  if(UI.weeklyView==='table') renderWeeklyTable();
  else renderWeeklyBoard();
}
function renderWeeklyTable(){
  const el=$('weekly-content');
  if(!DB.tasks.length){ el.innerHTML=emptyState('📅','No tasks yet.','task'); return; }
  const sorted=!!UI.sortCol.weekly;
  const arr=sortedArr(DB.tasks,'weekly');
  const rows=arr.map(t=>{
    const cats=(t.categoryIds||[]).map(id=>{ const c=getCat(id); return c?`<span class="chip chip-accent">${esc(c.name)}</span>`:''; }).join('');
    const days=(t.days||[]).map(d=>`<span class="chip chip-outline">${d.slice(0,3)}</span>`).join('');
    const drag=!sorted?`draggable="true" ondragstart="onRowDragStart(event,'${t.id}','tasks')" ondragend="onRowDragEnd(event)" ondragover="onRowDragOver(event)" ondrop="onRowDrop(event,'${t.id}','tasks')"` :'';
    return `<tr ${drag} onclick="openDrawer('task','${t.id}')">
      ${!sorted?`<td class="row-handle" onclick="event.stopPropagation()" title="Drag to reorder">⠿</td>`:'<td></td>'}
      <td class="td-name">${esc(t.action)}</td>
      <td>${t.status?`<span class="chip chip-${statusColor(t.status)}" style="font-size:.63rem;max-width:120px;overflow:hidden;text-overflow:ellipsis">${esc(t.status)}</span>`:'—'}</td>
      <td><div class="chips-wrap">${days||'—'}</div></td>
      <td>${t.quadrant?`<span class="chip chip-${quadColor(t.quadrant)}">${esc(t.quadrant)}</span>`:'—'}</td>
      <td>${formatDate(t.dueDate)||'—'}</td>
      <td><div class="chips-wrap">${cats||'—'}</div></td>
      <td style="max-width:160px">${esc(t.actionBreakdown||'')}</td>
    </tr>`;
  }).join('');
  el.innerHTML=`<div class="table-wrap"><table class="dt"><thead><tr>
    <th class="th-handle">${sorted?'':'⠿'}</th>
    ${thHtml('weekly','action','Action')}${thHtml('weekly','status','Status')}
    ${thHtml('weekly','days','Day(s)')}${thHtml('weekly','quadrant','Quadrant')}
    ${thHtml('weekly','dueDate','Due Date')}${thHtml('weekly','categoryIds','Category')}
    <th>Breakdown</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ═══════════════════════════════════════════════════════
//  WEEKLY — BOARD
// ═══════════════════════════════════════════════════════
function renderWeeklyBoard(){
  const el=$('weekly-content');
  let html=`<div class="board-outer"><div class="board-scroll">`;
  DAYS.forEach(day=>{
    const tasks=DB.tasks.filter(t=>(t.days||[]).includes(day));
    const cards=tasks.length
      ?tasks.map(t=>{
        const cats=(t.categoryIds||[]).map(id=>{ const c=getCat(id); return c?`<span class="chip chip-accent">${esc(c.name)}</span>`:''; }).join('');
        return `<div class="board-card" onclick="openDrawer('task','${t.id}')">
          <div class="bc-name">${esc(t.action)}</div>
          ${t.actionBreakdown?`<div class="bc-summary">${esc(t.actionBreakdown)}</div>`:''}
          <div class="bc-footer">
            ${t.status?`<span class="chip chip-${statusColor(t.status)}" style="font-size:.6rem">${esc(t.status)}</span>`:''}
            ${t.quadrant?`<span class="chip chip-${quadColor(t.quadrant)}">${esc(t.quadrant)}</span>`:''}
            ${cats}
          </div>
        </div>`;
      }).join('')
      :'<div class="empty-col">No tasks</div>';
    html+=`<div class="board-col">
      <div class="board-col-header">
        <span class="col-name">${day}</span>
        <span class="col-count">${tasks.length}</span>
      </div>
      <div class="board-cards">${cards}</div>
    </div>`;
  });
  html+=`</div></div>`;
  el.innerHTML=html;
}

// ═══════════════════════════════════════════════════════
//  CATEGORIES TABLE
// ═══════════════════════════════════════════════════════
function renderCategories(){
  const el=$('categories-content');
  if(!DB.categories.length){ el.innerHTML=emptyState('🗂','No categories yet.','category'); return; }
  const rows=orderedCats().map(c=>{
    const projCount=DB.projects.filter(p=>(p.categoryIds||[]).includes(c.id)).length;
    const parent=c.parentId?getCat(c.parentId):null;
    return `<tr draggable="true"
      ondragstart="onRowDragStart(event,'${c.id}','categories')"
      ondragend="onRowDragEnd(event)"
      ondragover="onRowDragOver(event)"
      ondrop="onRowDrop(event,'${c.id}','categories')"
      onclick="openDrawer('category','${c.id}')">
      <td class="row-handle" onclick="event.stopPropagation()" title="Drag to reorder">⠿</td>
      <td class="td-name">${esc(c.name)}</td>
      <td>${esc(c.pic||'—')}</td>
      <td>${c.riskLevel?`<span class="chip chip-${riskColor(c.riskLevel)}">${esc(c.riskLevel)}</span>`:'—'}</td>
      <td>${formatDate(c.dueDate)||'—'}</td>
      <td>${projCount?`<span class="chip chip-outline">${projCount} project${projCount>1?'s':''}</span>`:'—'}</td>
      <td>${parent?esc(parent.name):'—'}</td>
    </tr>`;
  }).join('');
  el.innerHTML=`<div class="table-wrap"><table class="dt"><thead><tr>
    <th class="th-handle">⠿</th>
    <th>Category</th><th>PIC</th><th>Risk Level</th><th>Due Date</th><th>Projects</th><th>Parent</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ═══════════════════════════════════════════════════════
//  EMPTY STATE
// ═══════════════════════════════════════════════════════
function emptyState(icon,msg,type){
  return `<div class="empty-state"><div class="empty-icon">${icon}</div>
    <p>${msg}<br><button class="btn btn-accent btn-sm btn-inline" style="margin-top:14px" onclick="openDrawer('${type}',null)">+ Add one now</button></p>
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  DRAWER — OPEN / CLOSE
// ═══════════════════════════════════════════════════════
function openDrawer(type,id){
  UI.drawerType=type; UI.drawerItemId=id;
  const isNew=!id;
  const labels={project:'Project',task:'Task',category:'Category'};
  $('drawer-title').textContent=(isNew?'New ':'Edit ')+labels[type];
  if(type==='project') renderProjectDrawer(id);
  else if(type==='task') renderTaskDrawer(id);
  else renderCategoryDrawer(id);
  $('drawer-footer').innerHTML=
    (!isNew?`<button class="btn btn-danger btn-sm btn-inline" style="margin-right:auto" onclick="confirmDelete('${type}','${id}')">Delete</button>`:'')
    +`<button class="btn btn-ghost btn-sm btn-inline" onclick="closeDrawer()">Cancel</button>
       <button class="btn btn-accent btn-sm btn-inline" onclick="saveDrawer()">Save</button>`;
  $('overlay').classList.add('open');
  $('drawer').classList.add('open');
}
function closeDrawer(){

// ═══════════════════════════════════════════════════════
//  PILL / CHIP HELPERS
// ═══════════════════════════════════════════════════════
function setSinglePill(btn){
  // single-select: deselect siblings, select clicked
  const pills=btn.closest('.pill-select').querySelectorAll('.pill-opt');
  pills.forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}
function selPillVal(containerId){
  const el=document.querySelector(`#${containerId} .pill-opt.sel`);
  return el?el.dataset.val:null;
}
function selPillsVals(containerId){
  return [...document.querySelectorAll(`#${containerId} .pill-opt.sel`)].map(b=>b.dataset.day||b.dataset.val).filter(Boolean);
}
function selChipIds(containerId){
  return [...document.querySelectorAll(`#${containerId} .chip-opt.sel`)].map(b=>b.dataset.id);
}
function checkedIds(containerId){
  return [...document.querySelectorAll(`#${containerId} input[type=checkbox]:checked`)].map(b=>b.dataset.id);
}
function getInputVal(id){ const el=$(id); return el?el.value.trim():''; }

// ═══════════════════════════════════════════════════════
function saveDrawer(){
  if(UI.drawerType==='project') saveProject(UI.drawerItemId);
  else if(UI.drawerType==='task') saveTask(UI.drawerItemId);
  else saveCategory(UI.drawerItemId);
}

function saveProject(id){
  const name=getInputVal('d-name'); if(!name){ showToast('⚠ Project name is required'); return; }
  // Read status from the first pill-select in the drawer (Status field)
  const statusPill=document.querySelector('#drawer-body .pill-select:first-of-type .pill-opt.sel');
  const data={
    name,
    status: statusPill?statusPill.dataset.val:'Active',
    statusSummary: $('d-summary')?$('d-summary').value:'',
    nextAction: $('d-next')?$('d-next').value:'',
    categoryIds: selChipIds('d-cats'),
    blockedByIds: selChipIds('d-blocked'),
    taskIds: checkedIds('d-tasks'),
  };
  if(id){ Object.assign(getProj(id),data); }
  else{ DB.projects.push({id:uid(),...data}); }
  finishSave(id?'✓ Project updated':'✓ Project added');
}

function saveTask(id){
  const action=getInputVal('d-action'); if(!action){ showToast('⚠ Action name is required'); return; }
  const statusEl=document.querySelector('#d-tstatus .pill-opt.sel');
  const quadEl=document.querySelector('#d-quad .pill-opt.sel');
  const data={
    action,
    status: statusEl?statusEl.dataset.val:'0. Not Started',
    days: selPillsVals('d-days'),
    quadrant: quadEl?quadEl.dataset.val:'',
    dueDate: getInputVal('d-due'),
    categoryIds: selChipIds('d-tcats'),
    projectIds: selChipIds('d-tprojs'),
    actionBreakdown: getInputVal('d-breakdown'),
  };
  if(id){ Object.assign(getTask(id),data); }
  else{ DB.tasks.push({id:uid(),...data}); }
  finishSave(id?'✓ Task updated':'✓ Task added');
}

function saveCategory(id){
  const name=getInputVal('d-catname'); if(!name){ showToast('⚠ Category name is required'); return; }
  const riskEl=document.querySelector('#drawer-body .pill-opt.sel');
  const data={
    name,
    pic: getInputVal('d-pic'),
    riskLevel: riskEl?riskEl.dataset.val:'',
    dueDate: getInputVal('d-catdate'),
    parentId: $('d-parent')?$('d-parent').value:'',
  };
  if(id){ Object.assign(getCat(id),data); }
  else{ const nc={id:uid(),...data}; DB.categories.push(nc); DB.settings.categoryOrder.push(nc.id); }
  finishSave(id?'✓ Category updated':'✓ Category added');
}

function finishSave(msg){
  scheduleSave(); closeDrawer(); renderAll(); showToast(msg);
}

function toggleNewTaskForm(){
  const f=$('d-new-task-form');
  if(!f) return;
  const open=f.style.display!=='none';
  f.style.display=open?'none':'block';
  if(!open) setTimeout(()=>{ const a=$('d-nt-action'); if(a) a.focus(); },50);
}

function createLinkedTask(){
  const actionEl=$('d-nt-action'); if(!actionEl) return;
  const action=actionEl.value.trim();
  if(!action){ showToast('⚠ Task name is required'); actionEl.focus(); return; }
  const statusEl=document.querySelector('#d-nt-status .pill-opt.sel');
  const days=[...document.querySelectorAll('#d-nt-days .pill-opt.sel')].map(b=>b.dataset.day||b.dataset.val).filter(Boolean);
  const newTask={
    id:uid(), action,
    status: statusEl?statusEl.dataset.val:'0. Not Started',
    days, quadrant:'', dueDate:'', categoryIds:[], projectIds:[], actionBreakdown:''
  };
  DB.tasks.push(newTask);
  // Add as checked item in the linked-list
  const list=$('d-tasks');
  const noItems=list.querySelector('.no-items');
  if(noItems) noItems.remove();
  const item=document.createElement('label');
  item.className='linked-item';
  item.innerHTML=`<input type="checkbox" data-id="${newTask.id}" checked>
    <span class="linked-item-name">${esc(newTask.action)}</span>
    <span class="chip chip-${statusColor(newTask.status)}" style="font-size:.6rem;flex-shrink:0">${esc(newTask.status)}</span>`;
  list.appendChild(item);
  // Reset mini-form
  actionEl.value='';
  document.querySelectorAll('#d-nt-days .pill-opt').forEach(b=>b.classList.remove('sel'));
  document.querySelectorAll('#d-nt-status .pill-opt').forEach((b,i)=>{ b.classList.toggle('sel',i===0); });
  $('d-new-task-form').style.display='none';
  scheduleSave();
  showToast('✓ Task created — click Save to link it to this project');
}

// ═══════════════════════════════════════════════════════
//  DELETE
// ═══════════════════════════════════════════════════════
let _pendingDel=null;
function confirmDelete(type,id){
  const names={project:getProj(id)?.name, task:getTask(id)?.action, category:getCat(id)?.name};
  _pendingDel={type,id};
  $('confirm-title').textContent='Delete '+type+'?';
  $('confirm-msg').textContent=`"${names[type]||''}" will be permanently deleted. This cannot be undone.`;
  $('confirm-ok').onclick=executeDelete;
  $('confirm-dialog').classList.add('open');
}
function closeConfirm(){ $('confirm-dialog').classList.remove('open'); _pendingDel=null; }
function executeDelete(){
  if(!_pendingDel) return;
  const{type,id}=_pendingDel;
  if(type==='project'){
    DB.projects=DB.projects.filter(p=>p.id!==id);
    DB.projects.forEach(p=>{ p.blockedByIds=(p.blockedByIds||[]).filter(b=>b!==id); });
    DB.tasks.forEach(t=>{ t.projectIds=(t.projectIds||[]).filter(b=>b!==id); });
  }else if(type==='task'){
    DB.tasks=DB.tasks.filter(t=>t.id!==id);
    DB.projects.forEach(p=>{ p.taskIds=(p.taskIds||[]).filter(b=>b!==id); });
  }else{
    DB.categories=DB.categories.filter(c=>c.id!==id);
    DB.settings.categoryOrder=DB.settings.categoryOrder.filter(cid=>cid!==id);
    DB.projects.forEach(p=>{ p.categoryIds=(p.categoryIds||[]).filter(cid=>cid!==id); });
    DB.tasks.forEach(t=>{ t.categoryIds=(t.categoryIds||[]).filter(cid=>cid!==id); });
  }
  closeConfirm(); closeDrawer(); scheduleSave(); renderAll(); showToast('✓ Deleted');
}

//  BOARD COLUMN DRAG — OVERVIEW
// ═══════════════════════════════════════════════════════
function onColDragStart(e,catId){
  if(catId==='__uncat__'){ e.preventDefault(); return; }
  dragSrcId=catId;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{ const col=document.querySelector(`[data-cat-id="${catId}"]`); if(col) col.classList.add('dragging'); },0);
}
function onColDragEnd(e){
  dragSrcId=null;
  document.querySelectorAll('.board-col').forEach(c=>c.classList.remove('dragging','drag-over'));
}
function onColDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  // Highlight only valid targets
  document.querySelectorAll('.board-col').forEach(c=>c.classList.remove('drag-over'));
  const col=e.currentTarget;
  if(col.dataset.catId!==dragSrcId && col.dataset.catId!=='__uncat__') col.classList.add('drag-over');
}
function onColDrop(e,targetId){
  e.preventDefault();
  document.querySelectorAll('.board-col').forEach(c=>c.classList.remove('dragging','drag-over'));
  if(!dragSrcId||dragSrcId===targetId||targetId==='__uncat__'){ dragSrcId=null; return; }
  const order=DB.settings.categoryOrder;
  const si=order.indexOf(dragSrcId); const ti=order.indexOf(targetId);
  if(si===-1||ti===-1){ dragSrcId=null; return; }
  order.splice(si,1); order.splice(ti,0,dragSrcId);
  dragSrcId=null;
  scheduleSave(); renderOverview();
}

// ═══════════════════════════════════════════════════════
//  ROW DRAG-TO-REORDER (table rows)
// ═══════════════════════════════════════════════════════
let _rowDragSrcId=null;
let _rowDragArr=null;   // 'projects' | 'tasks' | 'categories'

function onRowDragStart(e,id,arr){
  _rowDragSrcId=id; _rowDragArr=arr;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',id);
  setTimeout(()=>{ e.target.closest('tr').classList.add('row-dragging'); },0);
}
function onRowDragEnd(e){
  _rowDragSrcId=null; _rowDragArr=null;
  document.querySelectorAll('tr.row-dragging,tr.row-drag-over').forEach(r=>{
    r.classList.remove('row-dragging','row-drag-over');
  });
}
function onRowDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('tr.row-drag-over').forEach(r=>r.classList.remove('row-drag-over'));
  const tr=e.currentTarget;
  if(tr && !tr.classList.contains('row-dragging')) tr.classList.add('row-drag-over');
}
function onRowDrop(e,targetId,arr){
  e.preventDefault();
  document.querySelectorAll('tr.row-dragging,tr.row-drag-over').forEach(r=>{
    r.classList.remove('row-dragging','row-drag-over');
  });
  if(!_rowDragSrcId || _rowDragSrcId===targetId || _rowDragArr!==arr) return;

  const dbArr = arr==='categories' ? DB.settings.categoryOrder
    : arr==='projects' ? DB.projects
    : DB.tasks;

  // For categories, reorder the categoryOrder array; for others, reorder DB array directly
  if(arr==='categories'){
    const order=DB.settings.categoryOrder;
    const si=order.indexOf(_rowDragSrcId);
    const ti=order.indexOf(targetId);
    if(si===-1||ti===-1) return;
    order.splice(si,1); order.splice(ti,0,_rowDragSrcId);
  } else {
    const srcIdx=dbArr.findIndex(x=>x.id===_rowDragSrcId);
    const tgtIdx=dbArr.findIndex(x=>x.id===targetId);
    if(srcIdx===-1||tgtIdx===-1) return;
    const [moved]=dbArr.splice(srcIdx,1);
    dbArr.splice(tgtIdx,0,moved);
  }

  _rowDragSrcId=null; _rowDragArr=null;
  scheduleSave();
  if(arr==='categories') renderCategories();
  else if(arr==='projects') renderOverviewTable();
  else renderWeeklyTable();
}
function exportJSON(){
  if(!DB.projects.length&&!DB.tasks.length&&!DB.categories.length){ showToast('Nothing to export yet'); return; }
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='progress-overview-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('✓ JSON exported');
}

.app-header-left{flex:1;min-width:0}.app-eyebrow{font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
.app-title{font-family:var(--font-serif);font-size:1.12rem;color:#FAF8F4}
.snap-badge{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);border-radius:4px;padding:3px 8px;font-size:.66rem;font-weight:600;letter-spacing:.06em}
/* Nav tabs (labels act as tabs) */
.nav-tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 16px;overflow-x:auto;scrollbar-width:none;position:sticky;top:54px;z-index:90}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{padding:11px 18px;font-size:.87rem;font-weight:500;color:var(--text-muted);display:inline-block;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;flex-shrink:0;transition:color .15s,border-color .15s;user-select:none}
.nav-tab:hover{color:var(--text)}
/* Sections hidden by default; shown when matching tab radio is checked */
.section{display:none}
#tab-ov:checked  ~ .nav-tabs label[for="tab-ov"],
#tab-wk:checked  ~ .nav-tabs label[for="tab-wk"],
#tab-cat:checked ~ .nav-tabs label[for="tab-cat"]{color:var(--accent);border-bottom-color:var(--accent)}
#tab-ov:checked  ~ .s-ov{display:block}
#tab-wk:checked  ~ .s-wk{display:block}
#tab-cat:checked ~ .s-cat{display:block}
/* Section toolbar */
.section-toolbar{display:flex;align-items:center;padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:104px;z-index:80;gap:10px}
/* View toggle (labels) */
.view-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);overflow:hidden;flex-shrink:0}
.view-btn{padding:5px 13px;font-size:.78rem;font-weight:600;color:var(--text-muted);display:inline-block;cursor:pointer;transition:background .15s,color .15s;user-select:none}
.view-btn:hover{background:var(--border)}
/* Overview view toggle active state */
#ov-vt:checked ~ .s-toolbar-ov label[for="ov-vt"],
#ov-vb:checked ~ .s-toolbar-ov label[for="ov-vb"],
#wk-vt:checked ~ .s-toolbar-wk label[for="wk-vt"],
#wk-vb:checked ~ .s-toolbar-wk label[for="wk-vb"]{background:var(--accent);color:#fff}
/* Scroll arrows — hidden by default, shown only when board radio is checked */
.scroll-arrows{display:none;align-items:center;gap:4px}
.scroll-arrow{width:30px;height:30px;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s;flex-shrink:0}
.scroll-arrow:hover{background:var(--accent);border-color:var(--accent);color:#fff}
#ov-vb:checked ~ .s-toolbar-ov .scroll-arrows{display:flex}
#wk-vb:checked ~ .s-toolbar-wk .scroll-arrows{display:flex}
/* Overview panels */
.ov-t-panel,.wk-t-panel{display:block}
.ov-b-panel,.wk-b-panel{display:none}
#ov-vb:checked ~ .ov-t-panel{display:none}
#ov-vb:checked ~ .ov-b-panel{display:block}
#wk-vb:checked ~ .wk-t-panel{display:none}
#wk-vb:checked ~ .wk-b-panel{display:block}
/* Table */
.table-wrap{overflow-x:auto;padding:16px}
table.dt{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);min-width:600px}
table.dt th{padding:9px 14px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);background:var(--surface2);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
table.dt td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text-muted);line-height:1.45}
table.dt td.td-name{color:var(--text);font-weight:500}.dt tr:last-child td{border-bottom:none}
table.dt tbody tr{transition:background .1s}.table.dt tbody tr:hover{background:var(--surface2)}
/* Chips */
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:.67rem;font-weight:600;white-space:nowrap}
.chip-green{background:var(--green-bg);color:var(--green)}.chip-amber{background:var(--amber-bg);color:var(--amber)}.chip-red{background:var(--red-bg);color:var(--red)}.chip-blue{background:var(--blue-bg);color:var(--blue)}.chip-gray{background:var(--gray-bg);color:var(--gray)}.chip-accent{background:var(--accent-light);color:var(--accent)}.chip-outline{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:4px}
/* Board */
.board-outer{overflow-x:auto;padding:14px 16px 40px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.board-scroll{display:flex;gap:14px;align-items:flex-start;min-width:min-content}
@media(max-width:700px){.board-scroll{flex-direction:column;min-width:unset}}
.board-col{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);width:260px;min-width:260px;flex-shrink:0;overflow:hidden}
@media(max-width:700px){.board-col{width:100%;min-width:unset}}
.board-col-header{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--surface2)}
.col-name{font-size:.82rem;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.col-count{font-size:.7rem;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 7px;flex-shrink:0}
.board-cards{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:50px}
.board-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;box-shadow:var(--shadow-sm)}
.bc-name{font-size:.83rem;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:6px}.bc-summary{font-size:.74rem;color:var(--text-muted);line-height:1.55;margin-bottom:7px;white-space:pre-wrap;word-break:break-word}.bc-next{font-size:.72rem;color:#9A4F1C;line-height:1.55;margin-bottom:7px;padding-top:6px;border-top:1px dashed var(--border);white-space:pre-wrap;word-break:break-word}.bc-next-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);display:block;margin-bottom:2px}.bc-tasks{display:flex;flex-direction:column;gap:2px;margin-bottom:7px;padding-top:6px;border-top:1px dashed var(--border)}.bc-tasks-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-light);margin-bottom:4px}.bc-footer{display:flex;flex-wrap:wrap;gap:4px}
.empty-col{padding:18px 12px;text-align:center;font-size:.76rem;color:var(--text-light);font-style:italic}
</style></head>
<body>
<!-- Tab radio controls — must live before header/nav/sections so CSS ~ works -->
<input type="radio" class="sr" name="tab" id="tab-ov"  ${chkOv}>
<input type="radio" class="sr" name="tab" id="tab-wk"  ${chkWk}>
<input type="radio" class="sr" name="tab" id="tab-cat" ${chkCat}>
<header class="app-header">
  <div class="app-header-left">
    <div class="app-eyebrow">Progress Overview</div>
    <div class="app-title">Snapshot — ${esc(snapDate)}</div>
  </div>
  <span class="snap-badge">READ ONLY</span>
</header>
<nav class="nav-tabs">
  <label for="tab-ov"  class="nav-tab">📊 Progress Overview</label>
  <label for="tab-wk"  class="nav-tab">📅 Weekly Plan</label>
  <label for="tab-cat" class="nav-tab">🗂 Categories</label>
</nav>
<!-- Overview section -->
<div class="section s-ov">
  <input type="radio" class="sr" name="ov-view" id="ov-vt" ${chkOvT}>
  <input type="radio" class="sr" name="ov-view" id="ov-vb" ${chkOvB}>
  <div class="section-toolbar s-toolbar-ov">
    <div class="view-toggle">
      <label for="ov-vt" class="view-btn">☰ Table</label>
      <label for="ov-vb" class="view-btn">▦ Board</label>
    </div>
    <div class="scroll-arrows">
      <button class="scroll-arrow" onclick="scrollBoard('ov',-1)" title="Scroll left">◀</button>
      <button class="scroll-arrow" onclick="scrollBoard('ov', 1)" title="Scroll right">▶</button>
    </div>
  </div>
  <div class="ov-t-panel">${ovTable}</div>
  <div class="ov-b-panel">${ovBoard}</div>
</div>
<!-- Weekly section -->
<div class="section s-wk">
  <input type="radio" class="sr" name="wk-view" id="wk-vt" ${chkWkT}>
  <input type="radio" class="sr" name="wk-view" id="wk-vb" ${chkWkB}>
  <div class="section-toolbar s-toolbar-wk">
    <div class="view-toggle">
      <label for="wk-vt" class="view-btn">☰ Table</label>
      <label for="wk-vb" class="view-btn">▦ Board</label>
    </div>
    <div class="scroll-arrows">
      <button class="scroll-arrow" onclick="scrollBoard('wk',-1)" title="Scroll left">◀</button>
      <button class="scroll-arrow" onclick="scrollBoard('wk', 1)" title="Scroll right">▶</button>
    </div>
  </div>
  <div class="wk-t-panel">${wkTable}</div>
  <div class="wk-b-panel">${wkBoard}</div>
</div>
<!-- Categories section -->
<div class="section s-cat">
  <div style="padding:16px">${catTable}</div>
</div>
<script>
function scrollBoard(sec,dir){
  var panel=document.querySelector('.'+sec+'-b-panel .board-outer');
  if(panel) panel.scrollBy({left:dir*560,behavior:'smooth'});
}
${'<'+'/script>'}
</body></html>`;
}

// Snapshot render helpers
function snapChip(val,cls){ return val?`<span class="chip chip-${cls}">${esc(val)}</span>`:''; }
function snapCatChips(ids){ return (ids||[]).map(id=>{ const c=getCat(id); return c?snapChip(c.name,'accent'):''; }).join(''); }

function snapOvTable(){
  if(!DB.projects.length) return '<div style="padding:40px;text-align:center;color:var(--text-light)">No projects</div>';
  const rows=DB.projects.map(p=>{
    const taskLinks=(p.taskIds||[]).map(tid=>{
      const t=getTask(tid); if(!t) return '';
      return `<span style="display:block;font-size:.72rem;color:var(--blue);line-height:1.4;">▸ ${esc(t.action)}</span>`;
    }).join('');
    return `<tr>
      <td class="td-name">${esc(p.name)}</td>
      <td>${snapChip(p.status,statusColor(p.status))}</td>
      <td><div class="chips-wrap">${snapCatChips(p.categoryIds)||'—'}</div></td>
      <td style="max-width:240px;white-space:pre-wrap;word-break:break-word;vertical-align:top;line-height:1.55">${preformat(p.statusSummary||'')}</td>
      <td style="max-width:200px;white-space:pre-wrap;word-break:break-word;vertical-align:top;line-height:1.55">${preformat(p.nextAction||'')}</td>
      <td style="min-width:120px">${taskLinks||'—'}</td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="dt"><thead><tr><th>Project</th><th>Status</th><th>Categories</th><th>Status Summary</th><th>Next Action</th><th>Linked Tasks</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function snapOvBoard(){
  const cats=orderedCats();
  const uncatProjs=DB.projects.filter(p=>!(p.categoryIds||[]).length);
  let html=`<div class="board-outer"><div class="board-scroll">`;
  cats.forEach(cat=>{
    const projs=DB.projects.filter(p=>(p.categoryIds||[]).includes(cat.id));
    const cards=projs.length?projs.map(p=>{
      const taskLinks=(p.taskIds||[]).map(tid=>{
        const t=getTask(tid); if(!t) return '';
        return `<span style="display:block;font-size:.72rem;color:var(--blue);line-height:1.4;">▸ ${esc(t.action)}</span>`;
      }).join('');
      return `<div class="board-card">
        <div class="bc-name">${esc(p.name)}</div>
        ${p.statusSummary?`<div class="bc-summary">${preformat(p.statusSummary)}</div>`:''}
        ${p.nextAction?`<div class="bc-next"><span class="bc-next-label">Next Action</span>${preformat(p.nextAction)}</div>`:''}
        ${taskLinks?`<div class="bc-tasks"><span class="bc-tasks-label">Tasks</span>${taskLinks}</div>`:''}
        <div class="bc-footer">${snapChip(p.status,statusColor(p.status))}</div>
      </div>`;
    }).join(''):'<div class="empty-col">No projects</div>';
    html+=`<div class="board-col"><div class="board-col-header"><span class="col-name">${esc(cat.name)}</span><span class="col-count">${projs.length}</span></div><div class="board-cards">${cards}</div></div>`;
  });
  if(uncatProjs.length){
    const cards=uncatProjs.map(p=>`<div class="board-card">
      <div class="bc-name">${esc(p.name)}</div>
      ${p.statusSummary?`<div class="bc-summary">${preformat(p.statusSummary)}</div>`:''}
      ${p.nextAction?`<div class="bc-next"><span class="bc-next-label">Next Action</span>${preformat(p.nextAction)}</div>`:''}
      <div class="bc-footer">${snapChip(p.status,statusColor(p.status))}</div>
    </div>`).join('');
    html+=`<div class="board-col"><div class="board-col-header"><span class="col-name">Uncategorized</span><span class="col-count">${uncatProjs.length}</span></div><div class="board-cards">${cards}</div></div>`;
  }
  return html+`</div></div>`;
}
function snapWkTable(){
  if(!DB.tasks.length) return '<div style="padding:40px;text-align:center;color:var(--text-light)">No tasks</div>';
  const rows=DB.tasks.map(t=>{
    const days=(t.days||[]).map(d=>`<span class="chip chip-outline">${d.slice(0,3)}</span>`).join('');
    return `<tr><td class="td-name">${esc(t.action)}</td>
      <td>${snapChip(t.status,statusColor(t.status))}</td>
      <td><div class="chips-wrap">${days||'—'}</div></td>
      <td>${t.quadrant?snapChip(t.quadrant,quadColor(t.quadrant)):'—'}</td>
      <td>${formatDate(t.dueDate)||'—'}</td>
      <td><div class="chips-wrap">${snapCatChips(t.categoryIds)||'—'}</div></td>
      <td style="max-width:160px">${esc(t.actionBreakdown||'')}</td></tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="dt"><thead><tr><th>Action</th><th>Status</th><th>Day(s)</th><th>Quadrant</th><th>Due Date</th><th>Category</th><th>Breakdown</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function snapWkBoard(){
  let html=`<div class="board-outer"><div class="board-scroll">`;
  DAYS.forEach(day=>{
    const tasks=DB.tasks.filter(t=>(t.days||[]).includes(day));
    const cards=tasks.length?tasks.map(t=>{
      const cats=snapCatChips(t.categoryIds);
      return `<div class="board-card"><div class="bc-name">${esc(t.action)}</div>${t.actionBreakdown?`<div class="bc-summary">${esc(t.actionBreakdown)}</div>`:''}<div class="bc-footer">${snapChip(t.status,statusColor(t.status))}${t.quadrant?snapChip(t.quadrant,quadColor(t.quadrant)):''}${cats}</div></div>`;
    }).join(''):'<div class="empty-col">No tasks</div>';
    html+=`<div class="board-col"><div class="board-col-header"><span class="col-name">${day}</span><span class="col-count">${tasks.length}</span></div><div class="board-cards">${cards}</div></div>`;
  });
  return html+`</div></div>`;
}
function snapCatTable(){
  if(!DB.categories.length) return '<div style="padding:40px;text-align:center;color:var(--text-light)">No categories</div>';
  const rows=orderedCats().map(c=>{
    const cnt=DB.projects.filter(p=>(p.categoryIds||[]).includes(c.id)).length;
    const parent=c.parentId?getCat(c.parentId):null;
    return `<tr><td class="td-name">${esc(c.name)}</td><td>${esc(c.pic||'—')}</td>
      <td>${c.riskLevel?snapChip(c.riskLevel,riskColor(c.riskLevel)):'—'}</td>
      <td>${formatDate(c.dueDate)||'—'}</td>
      <td>${cnt?`<span class="chip chip-outline">${cnt} project${cnt>1?'s':''}</span>`:'—'}</td>
      <td>${parent?esc(parent.name):'—'}</td></tr>`;
  }).join('');
  return `<table class="dt" style="width:100%"><thead><tr><th>Category</th><th>PIC</th><th>Risk Level</th><th>Due Date</th><th>Projects</th><th>Parent</th></tr></thead><tbody>${rows}</tbody></table>`;
}
</script>
</body>
</html>
