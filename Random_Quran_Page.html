<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random · 604</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F0E8;
      --surface: #FFFFFF;
      --surface-2: #EDE8DF;
      --border: #DED8CC;
      --text-primary: #1A1916;
      --text-secondary: #6E675E;
      --accent: #D97706;
      --accent-hover: #B45309;
      --accent-glow: rgba(217, 119, 6, 0.25);
      --accent-text: #FFFFFF;
      --btn-sec-bg: #EDE8DF;
      --btn-sec-text: #3D3A35;
      --shadow: rgba(0,0,0,0.07);
      --shadow-lg: rgba(0,0,0,0.12);
    }

    [data-theme="dark"] {
      --bg: #1C1B18;
      --surface: #252420;
      --surface-2: #2D2B27;
      --border: #3A3730;
      --text-primary: #F0EBE1;
      --text-secondary: #9B9488;
      --accent: #F59E0B;
      --accent-hover: #FBBF24;
      --accent-glow: rgba(245, 158, 11, 0.2);
      --accent-text: #1A1916;
      --btn-sec-bg: #2D2B27;
      --btn-sec-text: #C8C1B5;
      --shadow: rgba(0,0,0,0.25);
      --shadow-lg: rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.35s ease, color 0.35s ease;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 24px 0;
    }

    .app-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .theme-toggle {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      user-select: none;
    }
    .theme-toggle:hover { background: var(--border); }

    /* ── Main ── */
    main {
      flex: 1;
      width: 100%;
      max-width: 460px;
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ── Number Card ── */
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 44px 24px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 28px var(--shadow);
      transition: background 0.35s, border-color 0.35s, box-shadow 0.35s;
    }

    .card-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .number-wrap {
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .number-display {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(88px, 22vw, 144px);
      color: var(--accent);
      line-height: 1;
      transition: color 0.35s;
    }

    .number-display.pop {
      animation: numberPop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes numberPop {
      0%   { transform: scale(0.5) translateY(10px); opacity: 0; }
      60%  { transform: scale(1.07) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .placeholder-dash {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(60px, 16vw, 100px);
      color: var(--border);
      user-select: none;
      line-height: 1;
      transition: color 0.35s;
    }

    .range-pill {
      font-size: 0.78rem;
      color: var(--text-secondary);
      background: var(--surface-2);
      border-radius: 100px;
      padding: 4px 13px;
      border: 1px solid var(--border);
      transition: background 0.35s, border-color 0.35s;
    }

    /* ── Stats row ── */
    .stats-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .stat-pill {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      box-shadow: 0 2px 8px var(--shadow);
      transition: background 0.35s, border-color 0.35s;
    }

    .stat-value {
      font-family: 'DM Serif Display', serif;
      font-size: 1.55rem;
      color: var(--accent);
      line-height: 1;
      transition: color 0.35s;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    /* ── No-repeat toggle row ── */
    .mode-row {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px var(--shadow);
      transition: background 0.35s, border-color 0.35s;
    }

    .mode-info { display: flex; flex-direction: column; gap: 2px; }

    .mode-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .mode-desc {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--border);
      border-radius: 100px;
      transition: 0.3s;
    }

    .slider::before {
      content: '';
      position: absolute;
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(20px); }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 17px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.02rem;
      font-weight: 600;
      transition: all 0.2s;
      letter-spacing: 0.01em;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: none; }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    /* ── All-used banner ── */
    .all-used-banner {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 18px;
      text-align: center;
      font-size: 0.86rem;
      color: var(--text-secondary);
      display: none;
      transition: background 0.35s, border-color 0.35s;
    }

    .all-used-banner.show { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    /* ── History ── */
    .history-section { width: 100%; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .history-count {
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: var(--surface-2);
      padding: 3px 11px;
      border-radius: 100px;
      border: 1px solid var(--border);
      transition: background 0.35s, border-color 0.35s;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 7px 15px;
      font-family: 'DM Serif Display', serif;
      font-size: 1.08rem;
      color: var(--text-primary);
      transition: background 0.35s, border-color 0.35s, color 0.35s;
      animation: popIn 0.22s ease-out;
    }

    .history-item.latest {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    @keyframes popIn {
      from { transform: scale(0.75); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .history-empty {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-style: italic;
      padding: 4px 2px;
    }

    /* ── Footer ── */
    footer {
      padding: 12px 24px 20px;
      font-size: 0.73rem;
      color: var(--text-secondary);
      opacity: 0.55;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <span class="app-title">Random · 604</span>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
      <span id="theme-label">Dark</span>
    </button>
  </header>

  <main>

    <!-- Number card -->
    <div class="card">
      <span class="card-label">Your Number</span>
      <div class="number-wrap">
        <div id="number-display" class="number-wrap">
          <span class="placeholder-dash">—</span>
        </div>
      </div>
      <span class="range-pill">1 – 604</span>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-pill">
        <span class="stat-value" id="stat-used">0</span>
        <span class="stat-label">Picked</span>
      </div>
      <div class="stat-pill">
        <span class="stat-value" id="stat-remaining">604</span>
        <span class="stat-label">Remaining</span>
      </div>
    </div>

    <!-- No-repeat mode -->
    <div class="mode-row">
      <div class="mode-info">
        <span class="mode-title">🔁 No-repeat Mode</span>
        <span class="mode-desc">Avoid duplicates within this session</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="no-repeat-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn btn-primary" id="start-btn" onclick="generate()">Start</button>
      <button class="btn btn-secondary" onclick="resetSession()">Reset</button>
    </div>

    <!-- All used banner -->
    <div class="all-used-banner" id="all-used-banner">
      ✅ All 604 numbers have been used — hit <strong>Reset</strong> to start fresh.
    </div>

    <!-- History -->
    <div class="history-section">
      <div class="history-header">
        <span class="history-title">History</span>
        <span class="history-count" id="history-count">0 picks</span>
      </div>
      <div class="history-list" id="history-list">
        <span class="history-empty">No picks yet this session</span>
      </div>
    </div>

  </main>

  <footer>Reset clears all history and starts a fresh session</footer>

  <script>
    // ── State ──
    let usedNumbers = new Set();
    let history     = [];
    let isDark      = false;
    let audioCtx    = null;

    // ── Audio ──
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playChime() {
      try {
        const ctx  = getCtx();
        const t    = ctx.currentTime;
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        // Pleasant two-note ding
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.setValueAtTime(1108.73, t + 0.1);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
        osc.start(t);
        osc.stop(t + 0.6);
      } catch (e) { /* silently fail if audio blocked */ }
    }

    // ── Generate ──
    function generate() {
      const noRepeat = document.getElementById('no-repeat-toggle').checked;

      if (noRepeat && usedNumbers.size >= 604) {
        document.getElementById('all-used-banner').classList.add('show');
        return;
      }

      let num;
      if (noRepeat) {
        do { num = Math.floor(Math.random() * 604) + 1; }
        while (usedNumbers.has(num));
        usedNumbers.add(num);
      } else {
        num = Math.floor(Math.random() * 604) + 1;
      }

      history.unshift(num);
      renderNumber(num);
      renderHistory();
      renderStats();
      playChime();
    }

    // ── Render number ──
    function renderNumber(num) {
      const el = document.getElementById('number-display');
      el.innerHTML = `<span class="number-display">${num}</span>`;
      // Trigger animation
      requestAnimationFrame(() => {
        const span = el.querySelector('.number-display');
        if (span) { span.classList.add('pop'); }
      });
    }

    // ── Render history ──
    function renderHistory() {
      const list  = document.getElementById('history-list');
      const count = document.getElementById('history-count');

      if (history.length === 0) {
        list.innerHTML  = '<span class="history-empty">No picks yet this session</span>';
        count.textContent = '0 picks';
        return;
      }

      count.textContent = `${history.length} pick${history.length !== 1 ? 's' : ''}`;
      list.innerHTML = history.map((n, i) =>
        `<div class="history-item${i === 0 ? ' latest' : ''}">${n}</div>`
      ).join('');
    }

    // ── Render stats ──
    function renderStats() {
      const noRepeat = document.getElementById('no-repeat-toggle').checked;
      const used      = noRepeat ? usedNumbers.size : history.length;
      const remaining = noRepeat ? 604 - usedNumbers.size : 604 - history.length < 0 ? 0 : '—';

      document.getElementById('stat-used').textContent      = used;
      document.getElementById('stat-remaining').textContent = noRepeat ? 604 - usedNumbers.size : '—';

      const allDone = noRepeat && usedNumbers.size >= 604;
      document.getElementById('start-btn').disabled = allDone;
      if (allDone) document.getElementById('all-used-banner').classList.add('show');
    }

    // ── Reset ──
    function resetSession() {
      usedNumbers.clear();
      history = [];
      document.getElementById('number-display').innerHTML = '<span class="placeholder-dash">—</span>';
      document.getElementById('start-btn').disabled = false;
      document.getElementById('all-used-banner').classList.remove('show');
      renderHistory();
      document.getElementById('stat-used').textContent      = '0';
      document.getElementById('stat-remaining').textContent = '604';
    }

    // ── Theme ──
    function toggleTheme() {
      isDark = !isDark;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
      document.getElementById('theme-icon').textContent  = isDark ? '☀️' : '🌙';
      document.getElementById('theme-label').textContent = isDark ? 'Light' : 'Dark';
    }

    // Re-render stats when toggle changes
    document.getElementById('no-repeat-toggle').addEventListener('change', () => {
      if (!document.getElementById('no-repeat-toggle').checked) {
        document.getElementById('stat-remaining').textContent = '—';
        document.getElementById('all-used-banner').classList.remove('show');
        document.getElementById('start-btn').disabled = false;
      }
      renderStats();
    });

    // Respect system preference on load
    if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) toggleTheme();
  </script>
</body>
</html>
